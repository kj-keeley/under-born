<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UNDERBORN（アンダーボーン）</title>
<style>
  :root{
    --amber:#ffc46b; --cold:#9ec8ee; --ink:#e8e2d6; --dim:#7d7566;
    --panel:rgba(10,9,12,.88); --line:rgba(255,196,107,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#050508;color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;
    overscroll-behavior:none}
  #wrap{max-width:600px;margin:0 auto;padding:10px 10px 28px}
  header{display:flex;align-items:baseline;gap:10px;padding:2px 2px 6px}
  header h1{font-size:12px;font-weight:500;letter-spacing:.14em;margin:0;color:var(--dim)}
  header span{font-size:10px;color:#4a463d;letter-spacing:.08em}
  #status{height:22px;display:flex;align-items:center;gap:8px;font-size:12px;
    letter-spacing:.06em;padding-left:2px;transition:color .3s}
  #status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;
    box-shadow:0 0 8px currentColor;flex:none}
  #floorProgress{margin-left:auto;padding-right:2px;font-size:10px;color:#5f594f;
    font-variant-numeric:tabular-nums;letter-spacing:.1em}
  #stage{position:relative;width:100%;aspect-ratio:1/1;background:#000;
    border:1px solid rgba(255,255,255,.06);border-radius:2px;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;background:rgba(4,3,6,.9);padding:24px;z-index:10;overflow-y:auto}
  #overlay.show{display:flex}
  #pauseOverlay{position:absolute;inset:0;display:none;z-index:20;align-items:center;
    justify-content:center;background:rgba(3,2,7,.88);padding:24px;text-align:center}
  #pauseOverlay.show{display:flex}
  .pause-card{width:min(100%,340px);padding:24px 20px;border:1px solid var(--line);
    background:rgba(10,9,15,.96);box-shadow:0 18px 48px rgba(0,0,0,.7)}
  .pause-card h2{margin:0 0 18px;font-size:15px;font-weight:500;letter-spacing:.22em;color:var(--amber)}
  .pause-info{font-size:12px;line-height:2;color:#b9b2a3;margin-bottom:18px}
  .pause-info b{color:var(--ink)}
  .pause-actions{display:grid;gap:8px}
  .pause-warn{margin:12px 0 0;font-size:10px;line-height:1.6;color:#746d61}
  #overlay h2{margin:0;font-size:15px;font-weight:500;letter-spacing:.2em;color:var(--amber)}
  #overlay p{margin:0;font-size:12px;line-height:1.9;color:#a49c8c}
  #xsec{display:none;margin:4px auto;border-radius:4px;max-height:38vh;width:auto}
  #overlay b{color:var(--ink)}
  .theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(100%,420px)}
  .theme-choice{padding:11px 8px;text-align:left;color:var(--ink);border-color:rgba(255,196,107,.2)}
  .theme-choice b{display:block;color:var(--amber);font-size:12px;margin-bottom:4px}
  .theme-choice span{display:block;color:#777064;font-size:10px;line-height:1.45}
  .core-choice{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
  .core-choice b,.core-choice span{text-align:left}
  .core-sigil{width:28px;height:28px;border-radius:50%;border:2px solid var(--core-color);
    background:radial-gradient(circle at 50% 45%,var(--core-color),rgba(8,7,12,.95) 64%);
    box-shadow:0 0 12px color-mix(in srgb,var(--core-color) 45%,transparent)}
  .choice-back{width:min(100%,420px);padding:8px;color:var(--dim);font-size:10px}
  .progress-line{width:min(100%,420px);font-size:10px;line-height:1.7;color:#8f887a;margin-bottom:8px}
  .loop-box{width:min(100%,420px);padding:12px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
  .loop-box input{width:100%;accent-color:var(--amber)}
  #overlay.hole{justify-content:flex-end;background:linear-gradient(transparent 35%,rgba(3,2,7,.55) 68%,rgba(3,2,7,.96));padding-bottom:38px}
  #overlay.ending{background:rgba(3,2,7,.72)}
  @media(max-width:430px){.theme-grid{grid-template-columns:1fr}.theme-choice{padding:9px 8px}}
  #controls{display:flex;gap:8px;margin-top:8px}
  button{font:inherit;font-size:13px;letter-spacing:.08em;color:var(--ink);
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
    border-radius:2px;padding:13px 10px;cursor:pointer;transition:background .18s,color .18s}
  button:active{background:rgba(255,255,255,.09)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  #breathBtn{flex:2}
  #breathBtn.hot{color:#1a1206;background:#5588aa;border-color:#5588aa;
    box-shadow:0 0 26px rgba(255,196,107,.24)}
  #panelBtn{flex:none;width:60px;color:var(--dim);font-size:11.5px}
  #devDock{position:fixed;top:8px;right:8px;z-index:40}
  #devDock #panelBtn{background:rgba(10,9,12,.92)}
  #trueBtn2{flex:none;width:86px;color:var(--dim);font-size:10.5px;padding-left:5px;padding-right:5px}
  #trueBtn2.on{color:#1a1206;background:var(--amber);border-color:var(--amber);
    box-shadow:0 0 22px rgba(255,196,107,.35)}
  #pauseBtn{flex:none;width:60px;color:var(--dim);font-size:11px}
  #devBadge{position:fixed;left:6px;bottom:6px;z-index:100;pointer-events:none;
    padding:3px 6px;border:1px solid rgba(255,196,107,.45);background:rgba(6,5,9,.88);
    color:var(--amber);font-size:9px;letter-spacing:.16em}
  #panel{position:fixed;top:50px;right:8px;width:min(420px,calc(100vw - 16px));
    max-height:70vh;overflow-y:auto;overscroll-behavior:contain;z-index:39;
    background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 48px rgba(0,0,0,.58);
    border-radius:2px;padding:4px 12px 12px;display:none}
  #panel.open{display:block}
  .grp{display:flex;width:100%;align-items:center;justify-content:space-between;margin-top:8px;
    padding:9px 8px;font-size:10px;letter-spacing:.12em;color:#8f887a;text-align:left}
  .grp.open{color:var(--amber);border-color:rgba(255,196,107,.35)}
  .grp .arrow{display:inline-block;transition:transform .15s}
  .grp.open .arrow{transform:rotate(90deg)}
  .grpRows[hidden]{display:none}
  .row{display:grid;grid-template-columns:1fr 46px;align-items:center;gap:8px;
    padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .row label{font-size:11.5px;color:#b9b2a3}
  .row .val{font-size:12px;color:var(--amber);text-align:right;font-variant-numeric:tabular-nums}
  .row input[type=range]{grid-column:1/3;width:100%;margin:5px 0 0;accent-color:var(--amber);height:18px}
  .note{font-size:10.5px;color:#5c574c;line-height:1.6;padding-top:10px}
  .toggles{display:flex;gap:8px;padding-top:6px;flex-wrap:wrap}
  .toggles button{flex:1 1 44%;font-size:11.5px;padding:9px 4px;color:var(--dim)}
  .toggles button.on{color:var(--amber);border-color:rgba(255,196,107,.4)}
  #log{font-size:11px;color:#8f887a;line-height:1.7;padding:10px 2px 0;font-variant-numeric:tabular-nums}
  #log b{color:var(--ink);font-weight:600}
  #hint{font-size:10.5px;color:#4a463d;line-height:1.7;padding:8px 2px 0}
  body.cinematic header,body.cinematic #status,body.cinematic #controls,
  body.cinematic #log,body.cinematic #hint{display:none}
  body.cinematic #wrap{padding-top:10px}
  body.cinematic #stage{border-color:rgba(255,196,107,.12);box-shadow:0 0 40px rgba(0,0,0,.8)}
</style>
</head>
<body>
<div id="wrap">
  <header><h1>UNDERBORN</h1></header>
  <div id="status"><span class="dot"></span><span id="statusText">潜伏中</span><span id="floorProgress">1 / 50</span></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay"><h2 id="ovTitle"></h2><canvas id="xsec"></canvas><p id="ovBody"></p><div id="coinDisp" style="display:none;font-size:28px;color:#ffd75a;text-align:center;margin:8px 0"></div><button id="ovBtn">続ける</button></div>
    <div id="pauseOverlay"><div class="pause-card">
      <h2>ひとやすみ</h2>
      <div id="pauseInfo" class="pause-info"></div>
      <div class="pause-actions"><button id="resumeBtn">再開</button><button id="quitToTitleBtn">中断してタイトルへ</button></div>
      <p class="pause-warn">中断すると、この土地の攻略は失われます。セーブは行いません。</p>
    </div></div>
  </div>
  <div id="controls">
    <button id="breathBtn">息を止める (長押し)</button>
    <button id="trueBtn2" style="display:none">真の姿</button>
    <button id="mapBtn2">地図</button>
    <button id="pauseBtn">一時停止</button>
  </div>
  <div id="log"></div>
  <p id="hint">スワイプまたは矢印キーで移動（押している間ずっと進む）。マスターをタップで光を1段縮める／長押しで1段広げる。<br>
  祭壇の隣に立ち止まると、侵入者の冷たい火が自分の火に変わる。自分の火からは配下が生まれる。<br>
  侵入者は自分の火を消しに来る。すべての祭壇が自分の火になれば、この階を取り戻す。</p>
</div>
<script>
"use strict";
const DEV_STORAGE_KEY='underborn_dev_enabled_v1';
const DEV_DEFAULT=true; // 一般配布用ビルドでは、この1行だけ false に戻す。
const devQuery=new URLSearchParams(location.search).get('dev');
let persistentDev=null;
try{
  const saved=localStorage.getItem(DEV_STORAGE_KEY);
  persistentDev=saved==='0'||saved==='1'?saved:null;
}catch(e){}
const DEV=devQuery==='0'?false:devQuery==='1'?true:persistentDev!==null?persistentDev==='1':DEV_DEFAULT;
function setPersistentDev(enabled){
  try{
    const saved=enabled?'1':'0';
    localStorage.setItem(DEV_STORAGE_KEY,saved);
    persistentDev=saved;
    return true;
  }catch(e){ return false; }
}
/* ============================================================
   v5：視野錐・向き表現・配下減速・広域表示
   消したもの：種／ハート／光を投げる／探索地図／松明の無い敵／撃破数表示／
              光の4段目／比率クリアの残骸／配下の永続強化／3階構造
   戻したもの（1割）：光の中にいる配下は動きが速い
   残した中核：暗闇と点光源の描画（唯一の肯定データ）
   ============================================================ */

let W=24,H=24;
function makeThemeMap(kind){
  const g=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1?'#':'.'));
  const wallH=(y,x1,x2,gaps=[])=>{ for(let x=x1;x<=x2;x++) if(!gaps.includes(x)) g[y][x]='#'; };
  const wallV=(x,y1,y2,gaps=[])=>{ for(let y=y1;y<=y2;y++) if(!gaps.includes(y)) g[y][x]='#'; };
  const fill=(x,y,w,h)=>{ for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++) g[yy][xx]='#'; };
  const box=(x1,y1,x2,y2,doors=[])=>{
    for(let x=x1;x<=x2;x++){ g[y1][x]='#'; g[y2][x]='#'; }
    for(let y=y1;y<=y2;y++){ g[y][x1]='#'; g[y][x2]='#'; }
    for(const [x,y] of doors) g[y][x]='.';
  };
  let altars=[];
  if(kind==='ruins'){
    box(7,3,16,9,[[11,3],[12,3],[7,6],[16,6],[11,9],[12,9]]);
    box(7,14,16,20,[[11,14],[12,14],[7,17],[16,17],[11,20],[12,20]]);
    wallV(4,5,18,[8,11,15]); wallV(19,5,18,[8,12,15]);
    wallH(12,2,8,[5]); wallH(12,15,21,[18]);
    altars=[[3,3],[20,3],[11,6],[12,17],[3,20],[20,20]];
  }else if(kind==='swamp'){
    fill(3,3,3,2); fill(17,3,4,2); fill(9,8,2,4); fill(13,12,2,4);
    fill(3,11,4,3); fill(17,10,4,3); fill(7,18,3,3); fill(14,18,3,3);
    wallH(6,2,9,[6]); wallH(7,14,21,[18]); wallV(12,2,8,[5]); wallV(11,16,21,[19]);
    altars=[[2,4],[21,4],[7,9],[16,14],[3,19],[20,19]];
  }else if(kind==='desert'){
    wallH(4,2,18,[6,13]); wallH(8,5,21,[10,18]); wallH(12,2,18,[4,14]);
    wallH(16,5,21,[8,17]); wallH(20,2,18,[6,12]);
    fill(20,2,2,3); fill(2,9,2,2); fill(20,13,2,2); fill(2,17,2,2);
    altars=[[3,2],[18,6],[6,10],[17,14],[5,18],[20,21]];
  }else if(kind==='forest'){
    fill(3,3,3,3); fill(9,2,3,4); fill(17,3,4,3); fill(6,8,4,3);
    fill(14,8,3,4); fill(2,14,4,3); fill(9,14,4,4); fill(18,14,3,3);
    fill(5,20,4,2); fill(15,19,4,3); wallV(22,7,12,[10]);
    altars=[[2,2],[21,2],[12,7],[7,13],[21,18],[11,21]];
  }else{
    box(3,3,20,20,[[11,3],[12,3],[3,11],[3,12],[20,11],[20,12],[11,20],[12,20]]);
    box(7,7,16,16,[[11,7],[12,7],[7,11],[7,12],[16,11],[16,12],[11,16],[12,16]]);
    fill(10,10,4,4); wallH(5,5,18,[8,15]); wallH(18,5,18,[9,14]);
    altars=[[2,6],[21,6],[6,11],[17,12],[6,21],[17,21]];
  }
  for(const [x,y] of altars) g[y][x]='T';
  return g.map(r=>r.join(''));
}
function makeVerticalMap(variant=0){
  const w=12,h=48;
  const g=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>x===0||y===0||x===w-1||y===h-1?'#':'.'));
  const wallH=(y,gap)=>{ for(let x=1;x<w-1;x++) if(x!==gap) g[y][x]='#'; };
  const gapSets=[[2,9,3,8,4],[8,3,9,2,7],[4,8,2,9,5],[9,4,8,3,7],[3,8,4,9,2]];
  const gaps=gapSets[variant%gapSets.length];
  [40,32,24,16,8].forEach((y,i)=>wallH(y,gaps[i]));
  const cols=[6,4,7,5,7].map((x,i)=>Math.max(2,Math.min(9,x+((variant+i)%3)-1)));
  [[42,45,44],[34,38,36],[26,30,28],[18,22,20],[10,14,12]].forEach((r,i)=>{
    for(let y=r[0];y<=r[1];y++) if(y!==r[2]) g[y][cols[i]]='#';
  });
  const flip=variant%2===1;
  const altars=[[flip?9:2,44],[flip?2:9,37],[flip?9:2,29],[flip?2:9,21],[flip?9:2,13],[flip?2:9,5]];
  for(const [x,y] of altars) g[y][x]='T';
  return g.map(r=>r.join(''));
}
function makeLMap(variant=0){
  const w=28,h=28;
  const g=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>x===0||y===0||x===w-1||y===h-1?'#':'.'));
  const mirror=x=>variant?27-x:x;
  const wallH=(y,x1,x2,gaps=[])=>{ for(let x=x1;x<=x2;x++) if(!gaps.includes(x)) g[y][x]='#'; };
  const wallV=(x,y1,y2,gaps=[])=>{ for(let y=y1;y<=y2;y++) if(!gaps.includes(y)) g[y][x]='#'; };
  // 上側の一角を完全に埋め、左（variant 1は右）と下の二本の腕だけを残す。
  for(let y=1;y<=13;y++) for(let x=15;x<=26;x++) g[y][mirror(x)]='#';
  if(!variant){
    wallH(7,2,12,[5,10]); wallV(7,9,17,[12,16]);
    wallH(18,2,25,[5,13,21]); wallV(18,16,25,[20,24]);
  }else{
    wallH(7,15,25,[17,22]); wallV(20,9,17,[12,16]);
    wallH(18,2,25,[6,14,22]); wallV(9,16,25,[20,24]);
  }
  const baseAltars=[[3,3],[11,4],[4,11],[11,16],[20,20],[24,25]];
  for(const [bx,y] of baseAltars){ const x=mirror(bx); g[y][x]='T'; }
  return g.map(r=>r.join(''));
}
function makeWideMap(variant=0){
  const w=34,h=34;
  const g=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>x===0||y===0||x===w-1||y===h-1?'#':'.'));
  const wallH=(y,x1,x2,gaps=[])=>{ for(let x=x1;x<=x2;x++) if(!gaps.includes(x)) g[y][x]='#'; };
  const wallV=(x,y1,y2,gaps=[])=>{ for(let y=y1;y<=y2;y++) if(!gaps.includes(y)) g[y][x]='#'; };
  const shift=variant?2:0;
  wallH(8,2,31,[6+shift,17,28-shift]);
  wallH(17,2,31,[4+shift,13,22,30-shift]);
  wallH(25,2,31,[7,18+shift,27]);
  wallV(9+shift,3,30,[6,13,21,28]);
  wallV(24-shift,3,30,[5,12,20,29]);
  // 中央は広い交差点、四隅は小部屋として危険地帯と退避先を分ける。
  for(let y=13;y<=21;y++) for(let x=14;x<=20;x++){
    if((x===14||x===20||y===13||y===21)&&![[17,13],[17,21],[14,17],[20,17]].some(p=>p[0]===x&&p[1]===y)) g[y][x]='#';
  }
  const altars=[[3,3],[16,4],[30,3],[4,14],[29,19],[3,30],[17,29],[30,30]];
  for(const [x,y] of altars) g[y][x]='T';
  return g.map(r=>r.join(''));
}
const BASE_PATTERNS=[
  {name:'外回り',wps:[[[2,2],[21,2]],[[2,21],[21,21]],[[2,6],[21,6]],[[2,17],[21,17]]],tBranch:'L'},
  {name:'十字',wps:[[[5,2],[5,21]],[[18,2],[18,21]],[[2,8],[2,16]],[[21,7],[21,16]]],tBranch:'R'},
  {name:'中央',wps:[[[10,5],[10,18]],[[13,5],[13,18]],[[5,11],[18,11]],[[5,13],[18,13]]],tBranch:'A'}
];
const VERTICAL_PATTERN={name:'登攀',wps:[[[2,45],[9,3]],[[9,43],[2,5]],[[5,38],[5,10]],[[2,27],[9,27]],[[8,35],[3,12]]],tBranch:'A'};
function verticalFloor(variant){ return {kind:'vertical',label:'縦長',map:makeVerticalMap(variant),start:[5,46],patterns:[VERTICAL_PATTERN],enemyCount:4}; }
function lFloor(variant){
  const mirror=x=>variant?27-x:x;
  const raw=[[[2,2],[12,12]],[[3,25],[25,25]],[[10,3],[10,24]],[[3,16],[25,16]],[[5,10],[24,24]]];
  return {kind:'lshape',label:'L字',map:makeLMap(variant),patterns:[{name:'死角巡回',wps:raw.map(r=>r.map(p=>[mirror(p[0]),p[1]])),tBranch:'R'}],enemyCount:5};
}
function wideFloor(variant){
  return {kind:'wide',label:'大広間',map:makeWideMap(variant),patterns:[{name:'広域包囲',wps:[
    [[2,3],[31,3]],[[2,30],[31,30]],[[3,10],[30,23]],[[30,10],[3,23]],[[5,16],[28,16]],[[16,4],[16,29]]
  ],tBranch:'A'}],enemyCount:6};
}
const SPECIAL_FLOORS={
  ruins:{13:verticalFloor(0),16:lFloor(0)},
  swamp:{10:verticalFloor(1),12:lFloor(1)},
  desert:{11:verticalFloor(2),13:wideFloor(0)},
  forest:{10:verticalFloor(3)},
  volcano:{11:verticalFloor(4),17:wideFloor(1)}
};
const CORES={
  initial:{name:'初期コア',short:'初期',desc:'従来どおり。息止めは純粋な潜伏に使う。',color:'255,196,107',css:'#ffc46b'},
  swap:{name:'入れ替わりコア',short:'転位',desc:'息止め中、配下をタップすると1回だけ位置交換。',color:'190,130,255',css:'#be82ff'},
  darkfire:{name:'暗火コア',short:'暗火',desc:'消灯したまま点火可能。点火時に残り時間が半減。',color:'255,105,75',css:'#ff694b'},
  mist:{name:'霞コア',short:'霞',desc:'息止め中、厚さ1マスの壁を1回だけ通過。',color:'145,225,215',css:'#91e1d7'}
};
const THEMES={

const isWall=(x,y)=> x<0||y<0||x>=W||y>=H||grid[y][x]!==0;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

/* ---------- 幾何 ---------- */
function los(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy, x=x0, y=y0;
  for(let i=0;i<200;i++){
    if(x===x1&&y===y1) return true;
    const e2=2*err;
    if(e2>-dy){ err-=dy; x+=sx; }
    if(e2<dx){ err+=dx; y+=sy; }
    if(x===x1&&y===y1) return true;
    if(grid[y][x]!==0) return false;
  }
  return false;
}
function losA(x0,y0,x1,y1){          // 祭壇は壁の中なので始点だけ免除
  if(x0===x1&&y0===y1) return true;
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy, x=x0, y=y0, first=true;
  for(let i=0;i<200;i++){
    const e2=2*err;
    if(e2>-dy){ err-=dy; x+=sx; }
    if(e2<dx){ err+=dx; y+=sy; }
    if(x===x1&&y===y1) return true;
    if(!first&&grid[y][x]!==0) return false;
    first=false;
  }
  return false;
}
function bfs(sx,sy,gx,gy){
  if(isWall(gx,gy)) return null;
  if(sx===gx&&sy===gy) return [];
  const prev=new Int32Array(W*H).fill(-1);
  const start=sy*W+sx, goal=gy*W+gx;
  prev[start]=-2;
  const q=[start]; let head=0;
  while(head<q.length){
    const c=q[head++];
    if(c===goal) break;
    const cx=c%W, cy=(c/W)|0;
    for(const d of DIRS){
      const nx=cx+d[0], ny=cy+d[1];
      if(isWall(nx,ny)) continue;
      const ni=ny*W+nx;
      if(prev[ni]!==-1) continue;
      prev[ni]=c; q.push(ni);
    }
  }
  if(prev[goal]===-1) return null;
  const path=[]; let c=goal;
  while(c!==start){ path.push([c%W,(c/W)|0]); c=prev[c]; }
  return path.reverse();
}
function freeNear(cx,cy,rad,min){
  for(let i=0;i<50;i++){
    const a=Math.random()*Math.PI*2, r=min+Math.random()*(rad-min);
    const x=Math.round(cx+Math.cos(a)*r), y=Math.round(cy+Math.sin(a)*r);
    if(!isWall(x,y)) return [x,y];
  }
  return null;
}
function farTile(cx,cy,min){
  let best=null,bd=-1;
  for(let i=0;i<250;i++){
    const x=(Math.random()*W)|0, y=(Math.random()*H)|0;
    if(isWall(x,y)) continue;
    const d=dist(x,y,cx,cy);
    if(d>=min) return [x,y];
    if(d>bd){bd=d;best=[x,y];}
  }
  return best||[12,11];
}
function adjOf(a){ return DIRS.map(([dx,dy])=>[a.x+dx,a.y+dy]).filter(([x,y])=>!isWall(x,y)); }

/* ---------- 移動 ---------- */
function mover(x,y,spt){ return {tx:x,ty:y,fx:x,fy:y,px:x,py:y,t:1,spt,path:[],repath:0,dir:[1,0]}; }
function advance(e,dt){
  if(e.t<1){
    e.t=Math.min(1,e.t+dt/e.spt);
    const k=e.t*e.t*(3-2*e.t);
    e.fx=e.px+(e.tx-e.px)*k; e.fy=e.py+(e.ty-e.py)*k;
    if(e.t>=1){ e.px=e.tx; e.py=e.ty; e.fx=e.tx; e.fy=e.ty; }
    return;
  }
  if(e.path&&e.path.length){
    const n=e.path.shift();
    if(!isWall(n[0],n[1])){ e.px=e.tx; e.py=e.ty; e.tx=n[0]; e.ty=n[1]; e.t=0; e.dir=[e.tx-e.px,e.ty-e.py]; }
  }
}
function goTo(e,gx,gy){ const p=bfs(e.tx,e.ty,gx,gy); if(p) e.path=p; }
function warp(e,x,y){ e.tx=e.px=e.fx=x; e.ty=e.py=e.fy=y; e.t=1; e.path=[]; }

/* ---------- 明かり ---------- */
// 侵入者の火だけが焼き込まれる。自分の火は自分を晒さない
function computeStatic(){
  staticLight=new Float32Array(W*H);
  for(const a of altars){
    if(a.mine) continue;
    for(let y=Math.max(0,a.y-4);y<=Math.min(H-1,a.y+4);y++)
      for(let x=Math.max(0,a.x-4);x<=Math.min(W-1,a.x+4);x++){
        const d=dist(x,y,a.x,a.y);
        if(d>P.altarR) continue;
        if(!losA(a.x,a.y,x,y)) continue;
        const v=1-d/(P.altarR+0.4);
        if(v>staticLight[y*W+x]) staticLight[y*W+x]=v;
      }
  }
}
function illum(x,y){                    // 描くかどうかの判定（自分の火も含む）
  let v=staticLight[y*W+x]||0;
  for(const a of altars){
    const d=dist(x,y,a.x,a.y);
    if(d<=P.altarLit&&losA(a.x,a.y,x,y)) v=Math.max(v,1-d/(P.altarLit+0.4));
  }
  if(glowing()){
    const d=dist(x,y,master.tx,master.ty);
    if(d<=master.r&&los(master.tx,master.ty,x,y)) v=Math.max(v,1-d/(master.r+.5));
  }else if(x===master.tx&&y===master.ty) v=Math.max(v,0.5);
  for(const e of enemies){
    const d=dist(x,y,e.tx,e.ty);
    if(d<=P.torchLit&&los(e.tx,e.ty,x,y)) v=Math.max(v,1-d/(P.torchLit+.5));
  }
  return v;
}

/* ---------- 光 ---------- */
const radii=()=>[P.r0,P.r1,P.r2];
const glowing=()=> master.idx>=1;
const litNorm=()=> Math.max(0,Math.min(1,(master.r-P.r0)/Math.max(0.001,P.r2-P.r0)));
function updateLight(dt){
  const tgt=radii()[master.idx];
  if(Math.abs(master.r-tgt)<0.005){ master.r=tgt; return; }
  const up=tgt>master.r, time=up?P.grow:P.shrink;
  const rate= time<=0?1e9:Math.max(0.001,(P.r2-P.r0)/2)/time;
  master.r+=(up?1:-1)*rate*dt;
  if((up&&master.r>tgt)||(!up&&master.r<tgt)) master.r=tgt;
}

/* ---------- 発見 ---------- */
function inArc(e,tx,ty){
  const dx=tx-e.tx, dy=ty-e.ty, d=Math.hypot(dx,dy);
  if(d<0.7) return true;
  const fl=Math.hypot(e.dir[0],e.dir[1])||1;
  return (dx/d)*(e.dir[0]/fl)+(dy/d)*(e.dir[1]/fl) >= Math.cos((P.fov*Math.PI/180)/2);
}
// 光っている物は全方位から。侵入者の火の中に立つのも「光っている」に含む
function seesMaster(e){
  const d=dist(e.tx,e.ty,master.tx,master.ty);
  const stand=staticLight[master.ty*W+master.tx]||0;
  const openR=Math.max(glowing()?master.r:0, stand>0.22?P.torch:0);
  // 光の円内なら壁越しでも異変に気づく（視線不要）
  if(openR>0&&d<=openR) return true;
  if(d>P.torch) return false;
  if(!inArc(e,master.tx,master.ty)) return false;
  return los(e.tx,e.ty,master.tx,master.ty);
}
function seesMinion(e,m){
  if(e.ignoresMinions) return false;
  const d=dist(e.tx,e.ty,m.tx,m.ty);
  if(d>P.torch||!los(e.tx,e.ty,m.tx,m.ty)) return false;
  return e.alerted||inArc(e,m.tx,m.ty);
}
const minionSees=(m,e)=> dist(m.tx,m.ty,e.tx,e.ty)<=P.mSight && los(m.tx,m.ty,e.tx,e.ty);

  mode='play'; buildFloor();
  invuln=1.2; takeT=0; takeTarget=null;
}
function nextFloor(){        // 階クリア後の進行。ハート持ち越し、下限保証
  const prevStage=stageForFloor(floor);
  floor++; coinFloor=0; hearts=Math.max(hearts,3);
  breathHeld=false; breathTimer=0; breathCooldown=0;
  const newStage=stageForFloor(floor);
  if(newStage>prevStage && !forceTrueForm){
    pendingFloorStart={poem:newStage===2?CANON_POEMS.child:CANON_POEMS.lord};
    startEvolution(prevStage,newStage);
  }else beginPendingFloor();
}
/* ---------- 進化儀式（中断→注目→変身→宣言） ---------- */
function startEvolution(from,to){
  mode='evolve';
  evoAnim={t:0,from,to};
  if(audioReady){
    // おや…？の間（じらし）
    tone(392,0.5,'sine',0.05,0.2);
    tone(392,0.5,'sine',0.05,1.3);
  }
}
function finishEvolutionSequence(skipPoem){
  const to=evoAnim?evoAnim.to:0;
  evoAnim=null;
  if(skipPoem){ beginPendingFloor(); return; }
  const lines=pendingFloorStart&&pendingFloorStart.poem?pendingFloorStart.poem:(to===2?CANON_POEMS.child:CANON_POEMS.lord);
  evolutionBlackout={t:0,dur:0.6,lines}; mode='evolutionBlackout';
}
function updateEvolutionBlackout(dt){
  if(!evolutionBlackout) return;
  evolutionBlackout.t+=dt;
  if(evolutionBlackout.t>=evolutionBlackout.dur){
    const lines=evolutionBlackout.lines; evolutionBlackout=null;
    beginPoem(lines,6.4,true,'evolution');
  }
}
// 真の姿の増援スポーン。同時に湧くと数が読めないので0.35秒間隔で順に生まれる
// ・先兵（vanguard）：突入時にマスター周囲に3体。壁越しでも敵を追う
// ・祭壇バースト：真の姿でマスターが直灯した祭壇から通常配下が3体
let spawnQueue=[], spawnTimer=0, spawnIdx=0;
function queueSpawns(cx,cy,n,vanguard,scatter){
  if(spawnQueue.length===0){ spawnTimer=0.1; spawnIdx=0; }
  for(let i=0;i<n;i++) spawnQueue.push({cx,cy,vanguard,scatter});
}
function spawnVanguards(){ queueSpawns(master.tx,master.ty,trueFormStats().vanguards,true); }
function processSpawnQueue(dt){
  if(!spawnQueue.length) return;
  spawnTimer-=dt;
  if(spawnTimer>0) return;
  spawnTimer=0.35;
  const q=spawnQueue.shift();
  const g=freeNear(q.cx,q.cy,4,1);
  if(!g) return;
  const m=mover(g[0],g[1],q.vanguard?P.mFast:P.mSlow);
  m.hp=P.mHp; m.fighting=false;
  if(q.vanguard) m.vanguard=true;
  else m.bonus=true;   // 直灯ボーナス枠：祭壇由来の上限を食わない
  minions.push(m);
  // 別方向散開：偶奇で逆向きの初期目的地へ（ロードの2体演出）
  if(q.scatter){
    const ang=(spawnIdx%2===0?0:Math.PI)+Math.random()*0.9-0.45;
    const gx=Math.round(q.cx+Math.cos(ang)*5), gy=Math.round(q.cy+Math.sin(ang)*5);
    const gg=freeNear(gx,gy,3,0)||freeNear(q.cx,q.cy,7,3);
    if(gg){ goTo(m,gg[0],gg[1]); m.repath=1.4; }   // しばらく初期方向を維持
  }
  markAt(g[0],g[1],'生','rgba(255,206,130,');
  if(audioReady){ const up=Math.pow(1.26,spawnIdx%3);   // 3体で一巡する上がり音
    tone(392*up,0.10,'triangle',0.07); tone(523*up,0.16,'triangle',0.08,0.10); }
  spawnIdx++;
}
function nearestFloor(p){
  let best=null,bd=1e9;
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
    if(isWall(x,y)) continue;
    const d=Math.abs(x-p[0])+Math.abs(y-p[1]);
    if(d<bd){bd=d;best=[x,y];}
  }
  return best||[1,1];
}
function startNextEnemyIntro(){
  const type=enemyIntroQueue.shift();
  if(!type){
    enemyIntro=null; mode='play';
    return;
  }
  const target=enemies.find(e=>e.type===type);
  if(!target){ startNextEnemyIntro(); return; }
  enemyIntro={type,target,t:0,dur:3.8}; mode='intro';
}
function queueEnemyIntroductions(){
  for(const e of enemies){
    if(!ENEMY_INFO[e.type]||seenEnemyIntros.has(e.type)) continue;
    seenEnemyIntros.add(e.type); enemyIntroQueue.push(e.type);
  }
  if(enemyIntroQueue.length) startNextEnemyIntro();
}
function updateEnemyIntro(dt){
  if(!enemyIntro) return;
  enemyIntro.t+=dt;
  if(enemyIntro.t>=enemyIntro.dur) startNextEnemyIntro();
}
function skipEnemyIntro(){
  if(mode!=='intro'||!enemyIntro) return false;
  startNextEnemyIntro();
  return true;
}
function buildFloor(){
  selectFloorLayout();
  grid=[]; altars=[];
  spawnQueue.length=0; spawnTimer=0;
  for(let y=0;y<H;y++){
    const r=[];
    for(let x=0;x<W;x++){
      const c=MAP[y][x];
      if(c==='#') r.push(1);
      else if(c==='T'){ r.push(2); altars.push({x,y,mine:false,born:0}); }
      else r.push(0);
    }
    grid.push(r);
  }
  computeStatic();
  // 見通しのある床から始める（隅に置くと何も見えない）
  let best=currentFloorShape.start?nearestFloor(currentFloorShape.start):[Math.floor(W/2),Math.floor(H/2)],bs=-1;
  if(!currentFloorShape.start) for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
      if(isWall(x,y)) continue;
      let open=0;
      for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++) if(!isWall(x+i,y+j)) open++;
      let ad=99; for(const a of altars) ad=Math.min(ad,dist(x,y,a.x,a.y));
      if(ad<3.5) continue;
      const sc=open+Math.min(ad,8);
      if(sc>bs){bs=sc;best=[x,y];}
    }
  master=mover(best[0],best[1],P.mSpeed); master.idx=1; master.r=P.r1; exhaleBounce=0;
  breathHeld=false; breathTimer=0; breathCooldown=0;
  minions=[]; marks=[]; enemies=[];
  curPattern=floor<=3?0:Math.floor(Math.random()*PATTERNS.length);
  const PAT=PATTERNS[curPattern];
  const WPS=PAT.wps.map(route=>route.map(p=>p?nearestFloor(p):null));
  const baseEnemyCount=currentFloorShape.enemyCount||(floor<=3?2:floor<=6?3:4);
  const enemyCount=debugNoEnemies?0:baseEnemyCount+(campaign.loopLevel-1);
  // 本番進行：1〜2階は基本型のみ。特殊3種は3階から解禁する。
  const mix=floor<=2?['I','L','T']:TYPE_MIX[zoneOf(floor)];
  const difficultySpeed=Math.max(.58,1-(campaign.loopLevel-1)*.045);
  for(let i=0;i<enemyCount;i++){
    const type=mix[i%mix.length];
    const rt=makeRoute(type,i,WPS);
    const s=rt.wps[0];
    const e=mover(s[0],s[1],P.ePatrol);
    e.type=type; e.coneC=CONE_C[type]; e.branches=rt.branches||null;
    e.randomWalk=type==='R'; e.ignoresMinions=type==='B'; e.fastMinionKill=type==='H';
    e.speedMul=(type==='B'?1.65:(type==='H'?0.88:1))*difficultySpeed;
    e.wps=rt.wps;                          // nullはT字の分かれ道スロット
    e.wi=0; e.state='patrol'; e.timer=0; e.mark=''; e.markT=0; e.shake=0;
    e.last=null; e.maxHp=P.eHp; e.hp=e.maxHp; e.alerted=false; e.target=null; e.douse=0;
    enemies.push(e);
  }
  mode='play'; invuln=1.2; takeT=0; takeTarget=null;
  if(forceTrueForm) spawnVanguards();   // 真の姿中は新しい階でも先兵が付いてくる
  stats={t:0,first:-1,detect:0,caught:0,lost:0,taken:0,retaken:0};
  chainPause=0; chainCount=0; chainView=0; chainMarkT=0;
  sparkSelect=false; sparkQueue=[];
  flyHearts=[]; sparks=[];
  cam.x=master.tx+.5; cam.y=master.ty+.5;
  queueEnemyIntroductions();
}
function markAt(x,y,txt,col,big){ marks.push({x,y,txt,col,t:big?2.4:1.6,big}); }

/* ---------- 種火伝播 ---------- */
const SPARK_RADIUS=5; // 未使用になったが互換性のため残す
let sparkSelect=false, sparkQueue=[];
function spreadSpark(fromAltar){
  if(!fromAltar) return;
  const unlit=altars.filter(a=>!a.mine);
  if(unlit.length===0) return;
  // 祭壇から種火持ちの配下を1体生む（上限を無視。種火配下は一時的な存在）
  const sp=adjOf(fromAltar);
  if(!sp.length) return;
  const s=sp[(Math.random()*sp.length)|0];
  const m=mover(s[0],s[1],P.mFast*0.7);
  m.hp=P.mHp; m.fighting=false;
  m.spark=true; m.sparkTarget=null;
  minions.push(m);
  sparkQueue=[m];
  chainCount++;
  // くじ引き：行き先はランダムで決まる（v5方式）
  m.sparkTarget=unlit[(Math.random()*unlit.length)|0];
  sparkQueue=[];
  chainPause=1.5; chainMarkT=1.5;
}

/* ---------- 更新 ---------- */
let seenBy=0, worst=0;
function update(dt){
  stats.t+=dt; invuln=Math.max(0,invuln-dt);
  updateTimedTrueForm(dt);
  processSpawnQueue(dt);   // 真の姿の増援（先兵・祭壇バースト）
  screenShake=Math.max(0,screenShake-dt);
  nearMissT=Math.max(0,nearMissT-dt);
  exhaleBounce=Math.max(0,exhaleBounce-dt);
  updateLight(dt);
  // 息止めシステム更新
  if(breathHeld){
    breathTimer-=dt;
    if(breathTimer<=0) releaseBreath();  // 時間切れで自動解除
  }
  if(breathCooldown>0) breathCooldown=Math.max(0,breathCooldown-dt);
  if(hearts<=0 && mode==='play'){
    heartbeatT+=dt;
    if(heartbeatT>=0.8){ heartbeatT=0; if(audioReady) tone(55,0.15,'sine',0.12); }
  } else { heartbeatT=0; }
  advance(master,dt);
  for(let i=marks.length-1;i>=0;i--){ marks[i].t-=dt; if(marks[i].t<=0) marks.splice(i,1); }
  for(let i=flyHearts.length-1;i>=0;i--){
    const h=flyHearts[i];
    if(h.wait>0){ h.wait-=dt; continue; }
    h.t+=dt/(h.kind==='lose'?1.1:1.0);
    if(h.kind==='gain'){ h.tx=master.fx+.5; h.ty=master.fy+.5; }   // 自分が動いても追いかける
    if(h.t>=1){
      if(h.kind==='gain'){  // 着弾：金の火花がジャラっと散る + 輪 + マスターが光る
        sfxCoin(chainCount);
        marks.push({x:h.tx-.5,y:h.ty-.5,txt:'',col:'',t:0.5,ring:true});
        master.goldFlash=0.6;
        for(let p=0;p<10;p++){ const a=Math.random()*Math.PI*2, sp=1.5+Math.random()*3;
          sparks.push({x:h.tx,y:h.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.2,t:0.7+Math.random()*0.3}); }
      }
      flyHearts.splice(i,1);
    }
  }
  if(master.goldFlash>0) master.goldFlash-=dt;
  if(masterPulse>0) masterPulse-=dt;
  if(master._emptyMark>0) master._emptyMark-=dt;
  if(igniteKick>0) igniteKick-=dt;
  for(let i=sparks.length-1;i>=0;i--){ const p=sparks[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=4*dt; p.t-=dt; if(p.t<=0) sparks.splice(i,1); }

  // 祭壇を自分の火に変える：隣に立ち止まる
  {
    let near=null;
    for(const a of altars){
      if(a.mine) continue;
      if(Math.abs(a.x-master.tx)+Math.abs(a.y-master.ty)===1){ near=a; break; }
    }
    if(near&&master.t>=1&&canIgniteNow()){
      takeTarget=near; takeT+=dt;
      if(takeT>=igniteNeed()){   // 段階で短縮：1.4s→1.19s→0.7s→即時
        hearts--;
        near.mine=true; near.born=P.bornSec*0.35; computeStatic();
        takeT=0; takeTarget=null; stats.taken++;
        near._claimFlash=1.0;
        markAt(near.x,near.y,'灯','rgba(255,196,107,');
        screenShake=0.5; masterPulse=0.4; igniteKick=0.15;
        markAt(near.x,near.y-1,'♥-1','rgba(255,100,80,',true);
        sfxIgnite();
        applyCoreIgniteCost();
        heartFly(master.fx+.5,master.fy+.5,near.x+.5,near.y+.5,'pay');
        {
          const st=masterStage();
          if(st===4) queueSpawns(near.x,near.y,3,false);            // 真の姿：3体
          else if(st===3) queueSpawns(near.x,near.y,2,false,true);  // ロード：2体が別方向へ散る
        }
        spreadSpark(near);
      }
    }else{ takeT=0; takeTarget=null; }
  }

  // 連鎖ポーズ中は全エンティティを止める
  if(chainPause>0){
    chainPause-=dt;
    chainMarkT=Math.max(0,chainMarkT-dt);
    chainView+=(1-chainView)*0.12; // カメラが引く
    // sparkSelect中にタイムアウト → 自動配分
    if(sparkSelect && chainPause<=96){
      // 3秒経過（99→96）：未選択の配下を最寄り祭壇に自動配分
      const unlit=altars.filter(a=>!a.mine);
      for(const m of sparkQueue){
        if(!m.sparkTarget && unlit.length){
          let best=null, bd=1e9;
          for(const a of unlit){ const d=dist(m.tx,m.ty,a.x,a.y); if(d<bd){bd=d;best=a;} }
          m.sparkTarget=best;
        }
      }
      sparkQueue=[]; sparkSelect=false;
      chainPause=1.5; chainMarkT=1.5;
    }
    if(chainPause<=0){
      chainView=0;
    }
    // claimFlashの減衰だけ回す
    for(const a of altars) if(a._claimFlash>0) a._claimFlash=Math.max(0,a._claimFlash-dt*1.8);
    return; // ポーズ中はここで止める
  }

  // 自分の火から配下が生まれる
  for(const a of altars){
    if(!a.mine) continue;
    a.born-=dt;
    if(a.born<=0){
      a.born=P.bornSec;
      // 上限＝灯した祭壇数。真の姿の間は撤廃。先兵・直灯ボーナスは枠を食わない
      if(masterStage()===4 || minions.filter(m=>!m.vanguard&&!m.bonus).length<mine()){
        const sp=adjOf(a);
        if(sp.length){
          const s=sp[(Math.random()*sp.length)|0];
          const m=mover(s[0],s[1],P.mSlow);
          m.hp=P.mHp; m.fighting=false; minions.push(m);
          markAt(a.x,a.y,'生','rgba(255,206,130,');
        }
      }
    }
  }

  // 敵は一度に一人しか殴れない
  for(const e of enemies) e.adj=0;
  for(const m of minions)
    for(const e of enemies){ if(!e.ignoresMinions&&dist(e.tx,e.ty,m.tx,m.ty)<=1.05){ e.adj++; break; } }

  // 配下
  for(let i=minions.length-1;i>=0;i--){
    const m=minions[i];
    // 足止め時限で復帰（消えない。再び走り出す）
    if(m.stallTimer!==undefined && m.stallTimer<=0 && (!m.spark || m.revived)){
      if(illum(m.tx,m.ty)<0.06) markAt(m.tx,m.ty,'散','rgba(255,196,107,');
      minions.splice(i,1); stats.lost++; continue;
    }
    // 戻した1割：光の中にいる配下は動きが速い
    const inLight = glowing() && dist(m.tx,m.ty,master.tx,master.ty)<=master.r;
    if(!m.spark) m.spt = inLight ? P.mFast : P.mSlow;

    // 種火持ちが祭壇に到着したらチェーン発火
    if(m.spark && m.sparkTarget && !m.sparkTarget.mine){
      if(Math.abs(m.sparkTarget.x-m.tx)+Math.abs(m.sparkTarget.y-m.ty)<=1 && m.t>=1){
        m.sparkTarget.mine=true; m.sparkTarget.born=P.bornSec*0.35; computeStatic();
        m.sparkTarget._claimFlash=1.0; stats.taken++;
        hearts=Math.min(hearts+1,maxHearts);
        markAt(m.sparkTarget.x,m.sparkTarget.y,'灯','rgba(255,196,107,');
        sfxIgnite(); igniteKick=0.15;
        markAt(m.sparkTarget.x,m.sparkTarget.y-1,'♥+1','rgba(255,180,80,',true);
        heartFly(m.sparkTarget.x+.5,m.sparkTarget.y+.5,master.fx+.5,master.fy+.5,'gain');
        const lit=m.sparkTarget;
        m.spark=false; m.sparkTarget=null;
        spreadSpark(lit);
      }
    }

    // 足止め：敵と接触 → 7秒間両者停止 → 種火持ちは復帰して走り直す
    let stalling=false;
    if(m.stallTimer!==undefined && m.stallTimer>0){
      m.stallTimer-=dt;
      stalling=true;
      if(m.stallTimer<=0 && m.spark && m.sparkTarget && !m.revived){
        // 復帰：最寄りの未点火祭壇に向かい直す
        let best=null, bd=999;
        for(const a of altars){ if(a.mine) continue;
          const d=dist(m.tx,m.ty,a.x,a.y); if(d<bd){bd=d;best=a;} }
        if(best){ m.sparkTarget=best; m.path=[]; m.t=1; m.revived=true; goTo(m,best.x,best.y);
          markAt(m.tx,m.ty,'復帰！','rgba(150,220,255,'); }
        else { m.spark=false; }   // 全部灯いてたら種火を消す
      }
      for(const e of enemies){
        if(!e.ignoresMinions&&dist(e.tx,e.ty,m.tx,m.ty)<=1.5){
          e.path=[]; // 敵も動けない
        }
      }
    } else {
      for(const e of enemies){
        if(e.ignoresMinions) continue;
        if(dist(e.tx,e.ty,m.tx,m.ty)<=1.05){
          const stallSec=e.fastMinionKill?2.4:7;
          m.stallTimer=stallSec;
          e.stallTimer=masterStage()===4?stallSec*2:stallSec;
          stalling=true;
          if(!e.alerted&&!inArc(e,m.tx,m.ty)) e.alerted=true;
          if(e.state==='patrol'){ e.mark='！'; e.markT=1.2; }
          e.state='chase'; e.last=[m.tx,m.ty]; e.timer=P.search; e.chaseTimer=1.5; e.path=[];
          markAt(m.tx,m.ty,'止','rgba(255,196,107,');
          break;
        }
      }
    }
    m.fighting=stalling;
    if(stalling){ continue; }

    // 種火持ちは目標祭壇に直行
    if(m.spark && m.sparkTarget && !m.sparkTarget.mine){
      m.repath-=dt;
      if(m.t>=1&&(m.path.length===0||m.repath<=0)){
        m.repath=0.3;
        const sp=adjOf(m.sparkTarget);
        if(sp.length) goTo(m,sp[0][0],sp[0][1]);
      }
      advance(m,dt); continue;
    }
    if(m.spark && m.sparkTarget && m.sparkTarget.mine){
      m.spark=false; m.sparkTarget=null;
    }

    m.repath-=dt;
    if(m.t>=1&&m.path.length===0&&m.repath<=0){
      m.repath=0.35+Math.random()*0.3;

      // 光が全開ならマスターに引き寄せられる（先兵は敵を優先）
      const vg=m.vanguard&&masterStage()===4;
      if(master.idx>=2 && !vg){
        goTo(m,master.tx,master.ty);
      } else {
        let tgt=null,bs=1e9;
        for(const e of enemies){
          if(!vg && !minionSees(m,e)) continue;   // 先兵は壁越しでも気配を追う
          const sc=dist(m.tx,m.ty,e.tx,e.ty)-3*(e.adj||0);
          if(sc<bs){bs=sc;tgt=e;}
        }
        if(tgt) goTo(m,tgt.tx,tgt.ty);
        else{
          // 見える敵がいなければ、自分の火の祭壇のそばを回る
          const own=altars.filter(a=>a.mine);
          let g=null;
          if(own.length){
            const a=own[(Math.random()*own.length)|0];
            const sp=adjOf(a); if(sp.length) g=sp[(Math.random()*sp.length)|0];
          }
          if(!g) g=freeNear(m.tx,m.ty,7,2);
          if(g) goTo(m,g[0],g[1]);
        }
      }
    }
    advance(m,dt);
  }

  // 敵
  seenBy=0; worst=0;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.hp<=0){
      if(illum(e.tx,e.ty)<0.06) markAt(e.tx,e.ty,'×','rgba(158,200,238,');
      enemies.splice(i,1); continue;
    }
    if(e.markT>0) e.markT-=dt;

    const watching=!!sparkRunner();      // 操作ロック＝身を潜めてる
    const eStall=e.stallTimer!==undefined&&e.stallTimer>0;   // 配下に気を取られてる
    const spotted=!watching&&!eStall&&seesMaster(e);
    if(spotted){
      seenBy++;
      if(e.state!=='chase'){
        stats.detect++;
        sfxAlert();
        if(stats.first<0) stats.first=stats.t;
        e.mark='！'; e.markT=1.4;
        screenShake=0.35;
      }
      e.state='chase'; e.last=[master.tx,master.ty]; e.timer=P.search; e.chaseTimer=1.5; e.path=[]; e.repath=0; e.douse=0;
    } else if(e.state==='patrol' && invuln<=0){
      // ニアミス判定：視野錐の外だが距離が近い
      const md=dist(e.tx,e.ty,master.tx,master.ty);
      if(md<=P.torch*0.7 && md>0.7 && !glowing()){
        const dx=master.tx-e.tx, dy=master.ty-e.ty, dd=Math.hypot(dx,dy)||1;
        const fl=Math.hypot(e.dir[0],e.dir[1])||1;
        const dot=(dx/dd)*(e.dir[0]/fl)+(dy/dd)*(e.dir[1]/fl);
        const threshold=Math.cos((P.fov*Math.PI/180)/2);
        if(dot>=threshold-0.18 && dot<threshold){
          nearMissT=0.7;
          nearMissAng=Math.atan2(master.fy-e.fy,master.fx-e.fx);
        }
      }
    }
    if(!debugInvincible&&invuln<=0&&mode==='play'&&!watching&&!eStall&&!breathHeld&&dist(e.fx,e.fy,master.fx,master.fy)<=0.62){
      if(masterStage()===4){
        // 真の姿：触れた敵が燃えて3秒動けない。マスターは無傷
        if(!(e.burnT>0)){
          e.burnT=3; e.stallTimer=Math.max(e.stallTimer||0,3);
          e.state='look'; e.timer=P.search; e.path=[];
          e.mark='炎'; e.markT=1.2;
          markAt(e.tx,e.ty,'炎','rgba(255,150,60,');
          screenShake=0.3;
          if(audioReady){ tone(180,0.25,'sawtooth',0.10,0,90); tone(720,0.12,'triangle',0.06); }
          for(let p=0;p<8;p++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*2.5;
            sparks.push({x:e.tx,y:e.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,t:0.5+Math.random()*0.3}); }
        }
      } else { caught(e); return; }
    }

    let mSeen=null,bd=1e9;
    for(const m of minions){
      if(!seesMinion(e,m)) continue;
      const d=dist(e.tx,e.ty,m.tx,m.ty);
      if(d<bd){bd=d;mSeen=m;}
    }
    if(mSeen&&e.state!=='chase'){
      if(e.state==='patrol'){ e.mark='！'; e.markT=1.2; }
      e.state='chase'; e.last=[mSeen.tx,mSeen.ty]; e.timer=P.search; e.chaseTimer=1.5; e.path=[]; e.repath=0; e.douse=0;
    }
    if(e.stallTimer>0) e.stallTimer-=dt;
    if(e.burnT>0) e.burnT-=dt;
    if(e._returning>0){ e._returning-=dt; if(e._returning<=0) e.spt=P.ePatrol*e.speedMul; }
    else e.spt = ((e.state==='chase') ? P.eChase : P.ePatrol)*e.speedMul;

    if(e.state==='patrol'){
      // 自分の火があれば消しに向かう。ただし同時に向かうのは P.responders 体まで
      const own=altars.filter(a=>a.mine);
      const responders=enemies.filter(x=>x.target&&x.target.mine).length;
      if(own.length && (e.target || responders<P.responders)){
        if(!e.target||!e.target.mine){
          let b=null,bd2=1e9;
          for(const a of own){ const d=dist(a.x,a.y,e.tx,e.ty); if(d<bd2){bd2=d;b=a;} }
          e.target=b; e.path=[];
        }
        const a=e.target;
        if(a&&Math.abs(a.x-e.tx)+Math.abs(a.y-e.ty)===1){
          e.douse+=dt; e.path=[];
          if(e.douse>=P.loseSec){
            a.mine=false; a.born=0; computeStatic(); e.douse=0; e.target=null;
            stats.retaken++; markAt(a.x,a.y,'消','rgba(158,200,238,');
          }
        }else if(e.t>=1&&e.path.length===0&&a){
          e.douse=0;
          const sp=adjOf(a);
          if(sp.length){ const s=sp[0]; goTo(e,s[0],s[1]); }
          if(e.path.length===0){ e.target=null; }
        }
      }else{
        e.target=null; e.douse=0;
        if(e.randomWalk&&e.t>=1&&e.path.length===0){
          const steps=DIRS.map(([dx,dy])=>[e.tx+dx,e.ty+dy]).filter(([x,y])=>!isWall(x,y));
          if(steps.length){
            const fresh=steps.filter(([x,y])=>!e.randomPrev||(x!==e.randomPrev[0]||y!==e.randomPrev[1]));
            const n=(fresh.length?fresh:steps)[(Math.random()*(fresh.length||steps.length))|0];
            e.randomPrev=[e.tx,e.ty]; e.path=[n];
          }
        }else if(e.t>=1&&e.path.length===0){ let w=e.wps[e.wi%e.wps.length];
            if(!w){ const br=PATTERNS[curPattern].tBranch;
              const pick= br==='L'?0 : br==='R'?1 : (e.wi>>1)%2;   // A=交互
              w=e.branches[pick%e.branches.length]; }
            e.wi++; goTo(e,w[0],w[1]); }
      }
    }else if(e.state==='chase'){
      if(e.chaseTimer!==undefined){ e.chaseTimer-=dt; if(e.chaseTimer<=0){ e.state='look'; e.timer=1.5; e.path=[]; continue; } }
      const goal = spotted?[master.tx,master.ty]:(mSeen?[mSeen.tx,mSeen.ty]:e.last);
      e.repath-=dt;
      if(!goal){ e.state='look'; e.timer=P.search; }
      else if(e.t>=1&&(e.path.length===0||e.repath<=0)){
        if(e.tx===goal[0]&&e.ty===goal[1]){
          if(!spotted&&!mSeen){ e.state='look'; e.timer=P.search; e.path=[]; }
        }else{ e.repath=0.5; goTo(e,goal[0],goal[1]); if(e.path.length===0){ e.state='look'; e.timer=P.search; } }
      }
    }else if(e.state==='look'){
      e.path=[]; e.timer-=dt; worst=Math.max(worst,e.timer);
      const a=Math.atan2(e.dir[1],e.dir[0])+dt*1.15;
      e.dir=[Math.cos(a),Math.sin(a)];
      if(e.timer<=0){
        e.mark='？'; e.markT=1.6; e.state='patrol'; e.last=null; e.alerted=false; e.target=null;
        e.spt=P.ePatrol*0.5*e.speedMul; e._returning=8;
        // 最寄りの巡回ポイントに向かう
        let bestD=999, bestWi=0;
        for(let wi=0;wi<e.wps.length;wi++){
          const w=e.wps[wi]; if(!w) continue;
          const d=Math.abs(e.tx-w[0])+Math.abs(e.ty-w[1]);
          if(d<bestD){ bestD=d; bestWi=wi; }
        }
        e.wi=bestWi;
        const wp=e.wps[e.wi]; if(wp) goTo(e,wp[0],wp[1]);
      }
    }
    advance(e,dt);
  }

  if(maybeStartBreathLesson()) return;
  if(mode!=='play') return;
  if(mine()===altars.length){
    if(floor>=FLOORS){
      // テーマ最終階クリア：地上の解放演出を経てリザルトへ
      mode='surface';
      if(audioReady){ tone(523,0.15,'square',0.08); tone(659,0.15,'square',0.08,0.15); tone(784,0.25,'square',0.10,0.30); tone(1047,0.4,'square',0.12,0.45); }
      startSurfaceEnding();
    } else {
      // 途中階：一瞬だけ表示して即次へ
      mode='won';
      if(audioReady){ tone(523,0.12,'square',0.06); tone(659,0.12,'square',0.06,0.10); }
      markAt(master.tx,master.ty-1,(floor+1)+'階へ','rgba(255,220,100,',true);
      setTimeout(()=>{ if(mode==='won') nextFloor(); },800);
    }
  }
}

function caught(e){
  if(debugInvincible) return;
  stats.caught++;
  hearts=Math.max(0,hearts-1);
  breathHeld=false; breathTimer=0; breathCooldown=0;
  master.idx=1;  // 光を戻す
  screenShake=0.8;
  markAt(master.tx,master.ty,'♥-1','rgba(255,100,80,',true);
  if(audioReady){ tone(220,0.3,'sawtooth',0.12); tone(140,0.4,'sawtooth',0.10,0.15); }
  if(hearts<=0){
    // ハート0＝ゲームオーバー（v5方式）
    mode='lost';
    show('火が絶えた',`<b>${floor}階</b>`,'もう一度');
    return;
  }
  // ハートが残ってる＝ワープで逃がす
  const p=farTile(e.tx,e.ty,10);
  warp(master,p[0],p[1]);
  master.idx=0; master.r=P.r0;
  invuln=2;
  e.state='look'; e.timer=P.search;
  sfxAlert();
}

function glow(cx,cy,rad,col,a){

/* ---------- マスター描画（段階進化・材質グラデ版） ---------- */
function mShell(s,o){
  o=o||{};
  const verts=o.verts||7, squish=o.squish||1, seed=o.seed||0;
  const pts=[];
  for(let i=0;i<verts;i++){
    const a=i/verts*Math.PI*2;
    const rr=s*(0.60+0.13*Math.sin(i*2.3+seed))*squish;
    pts.push([Math.cos(a)*rr,Math.sin(a)*rr]);
  }
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  const g=ctx.createLinearGradient(-s*0.6,-s*0.7,s*0.6,s*0.7);
  if(o.cold){ g.addColorStop(0,'#121017'); g.addColorStop(0.52,'#191621'); g.addColorStop(1,'#231e2a'); }
  else{       g.addColorStop(0,'#1a151f'); g.addColorStop(0.52,'#292130'); g.addColorStop(1,'#3d3040'); }
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=Math.max(1,s*0.06);
  ctx.strokeStyle=o.cold?'#2b2433':'#4b3d4d'; ctx.stroke();
  // 石の面を一筋だけ拾うハイライト
  const a1=pts[1], a2=pts[4%verts];
  ctx.beginPath(); ctx.moveTo(a1[0]*0.82,a1[1]*0.82); ctx.lineTo(a2[0]*0.76,a2[1]*0.76);
  ctx.strokeStyle=o.cold?'rgba(255,255,255,0.03)':'rgba(255,224,170,0.10)';
  ctx.lineWidth=Math.max(0.8,s*0.02); ctx.stroke();
}
function mCracks(s,o){
  o=o||{};
  const n=o.count||4, open=o.open==null?1:o.open, alpha=o.alpha==null?1:o.alpha;
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,180,90,'+(0.25+0.75*alpha)+')';
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+0.5;
    ctx.lineWidth=Math.max(1,s*(0.07+0.16*open));
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*s*0.12,Math.sin(a)*s*0.12);
    ctx.lineTo(Math.cos(a)*s*(o.len||0.62),Math.sin(a)*s*(o.len||0.62));
    ctx.stroke();
    if(o.branch){
      const a2=(i+1)/n*Math.PI*2+0.5;
      ctx.lineWidth=Math.max(1,s*0.06);
      ctx.beginPath(); ctx.arc(0,0,s*0.42,a,a2); ctx.stroke();
    }
  }
}
// 欠けた殻片：殻を破った証。tuck=息止めで身に寄せる
function mChip(s,tm,tuck,orbOfs){
  const orbA=(orbOfs||-0.95)+Math.sin(tm*0.5)*0.1;
  const r=s*(tuck?0.72:1.08);
  ctx.save(); ctx.translate(Math.cos(orbA)*r,Math.sin(orbA)*r);
  ctx.rotate(-0.28+Math.sin(tm*0.7)*0.05);
  ctx.beginPath();
  ctx.moveTo(-s*0.09,s*0.045); ctx.lineTo(0,-s*0.15); ctx.lineTo(s*0.12,-s*0.02); ctx.lineTo(s*0.03,s*0.13);
  ctx.closePath();
  ctx.fillStyle=tuck?'#221c28':'#2e2531'; ctx.fill();
  ctx.lineWidth=Math.max(1,s*0.02); ctx.strokeStyle=tuck?'#3a3040':'#59434e'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s*0.04,s*0.02); ctx.lineTo(s*0.02,-s*0.09);
  ctx.strokeStyle='rgba(255,180,90,'+(tuck?0.12:0.45)+')';
  ctx.lineWidth=Math.max(0.8,s*0.015); ctx.stroke();
  ctx.restore();
}
// 火の瞳：blink 1=開 0=閉
function mEye(s,o){
  o=o||{};
  const blink=o.blink==null?1:o.blink, color=o.color||'255,196,107', lit=o.lit==null?1:o.lit;
  const lx=(o.lookX||0)*s*0.07, ly=(o.lookY||0)*s*0.05;
  const h=Math.max(s*0.035, s*0.34*blink);
  ctx.fillStyle='rgba('+color+','+0.25*(0.4+0.6*lit)+')';
  ctx.beginPath(); ctx.ellipse(0,0,s*0.30,h*1.25,0,0,7); ctx.fill();
  ctx.fillStyle='rgba('+color+','+(0.35+0.60*lit)+')';
  ctx.beginPath(); ctx.ellipse(0,0,s*0.21,h,0,0,7); ctx.fill();
  if(blink>0.25){
    ctx.fillStyle='rgba(255,248,224,'+(0.45+0.50*lit)+')';
    ctx.beginPath(); ctx.arc(lx,ly,s*0.085*Math.min(1,blink+0.2),0,7); ctx.fill();
  }
}
function mBlink(period,ofs){
  const p=((performance.now()/1000+ofs)%period)/period;
  if(p>0.94){ const q=(p-0.94)/0.06; return q<0.5? 1-q*2 : (q-0.5)*2; }
  return 1;
}
// 本体：段階に応じたマスターを(px,py)に描く。base=標準半径(TS*0.34相当)
function renderMasterBody(px,py,base,stage,lit,o){
  o=o||{};
  const tm=performance.now()/1000;
  const hold=o.hold?1:0, dead=o.dead?1:0;
  const beat=dead?Math.pow(Math.max(0,Math.sin(tm*3.6)),6):0;
  const col=dead?'255,80,60':(o.coreColor||'255,196,107');
  const s=base*(stage===1?0.85:stage===3?1.12:stage===4?1.0:1.0);
  const blink=dead?0.35+beat*0.15:mBlink(3.4,0);
  // 息止め中は段階・コアにかかわらず、通常と同じ周期で瞬く目だけを残す。
  if(hold){
    ctx.save(); ctx.translate(px,py);
    mEye(s*(stage===4?1.25:stage===3?1.08:1),{
      blink,lookX:o.lookX||0,lookY:o.lookY==null?0.25:o.lookY,color:col,lit:0.22
    });
    ctx.restore();
    return;
  }
  // 影（真の姿は浮くので薄く小さく）
  ctx.fillStyle='rgba(0,0,0,'+(stage===4?0.45:0.75)+')';
  ctx.beginPath();
  ctx.ellipse(px,py+base*0.95,s*0.85*(stage===4?0.7:1),s*0.3*(stage===4?0.7:1),0,0,7);
  ctx.fill();
  const bob=stage===4?Math.sin(tm*1.4)*base*0.10:0;
  ctx.save(); ctx.translate(px,py-bob);
  const exhale=Math.max(0,Math.min(1,o.exhale||0));
  const breatheOut=1+Math.sin(Math.PI*(1-exhale))*0.08;
  const pulse=(1+Math.sin(tm*2.5)*0.05)*(1+beat*0.04)*breatheOut;
  ctx.scale(pulse,pulse);
  if(o.tilt) ctx.rotate(o.tilt);
  if(stage===1){
    // ベイビー：卵。亀裂1本、火は点。よちよち揺れ。殻片なし——まだ何も欠けていない
    ctx.save(); ctx.rotate(Math.sin(tm*2.2)*0.12);
    mShell(s,{verts:8,seed:1});
    mCracks(s,{count:1,open:0.12+0.88*lit,alpha:Math.max(0.3,lit),len:0.5});
    ctx.restore();
    ctx.fillStyle='rgba('+col+','+(0.35+0.65*lit)+')';
    ctx.beginPath(); ctx.arc(0,0,s*0.16,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,248,224,'+(0.45+0.55*lit)+')';
    ctx.beginPath(); ctx.arc(0,0,s*0.07,0,7); ctx.fill();
  }else if(stage===2||stage===3){
    // チャイルド/ロード：転がる石＋火の瞳＋殻片
    ctx.save(); ctx.rotate(tm*0.19*(dead?0.5:1)+(o.rotOfs||0));
    mShell(s,{});
    if(stage===2) mCracks(s,{open:0.12+0.88*lit,alpha:lit});
    else mCracks(s,{count:5,open:(0.12+0.88*lit)*1.2,alpha:lit,len:0.66,branch:lit>0.3});
    ctx.restore();
    mEye(s*(stage===3?1.1:1),{blink,lookX:o.lookX||0,lookY:o.lookY==null?0.3:o.lookY,color:col,lit:Math.max(0.35,lit)});
    if(stage===2) mChip(s,tm,false);
    else for(let i=0;i<3;i++){
      const a=tm*0.7+i*Math.PI*2/3;
      ctx.save(); ctx.translate(Math.cos(a)*s*1.35,Math.sin(a)*s*1.05); ctx.rotate(a+tm*0.5);
      mChip(s*0.9,tm+i,false); ctx.restore();
    }
  }else{
    // 真の姿：殻は砕け、破片が衛星軌道。火の本体が浮く
    for(let i=0;i<6;i++){
      const a=tm*(i%2?0.55:-0.4)+i*1.047;
      const rr=s*(1.15+0.25*Math.sin(tm*0.9+i));
      ctx.save(); ctx.translate(Math.cos(a)*rr,Math.sin(a)*rr*0.85); ctx.rotate(a*1.3);
      mChip(s*0.85,tm+i,false); ctx.restore();
    }
    ctx.fillStyle='rgba('+col+','+0.30*Math.max(0.3,lit)+')';
    ctx.beginPath(); ctx.arc(0,0,s*0.72,0,7); ctx.fill();
    mEye(s*1.5,{blink,lookX:o.lookX||0,lookY:o.lookY==null?0.2:o.lookY,color:col,lit:Math.max(0.35,lit)});
  }
  // コア固有の簡素なシルエット。進化段階の形は保ちつつ遠目で判別できる。
  if(o.core==='swap'){
    for(const side of [-1,1]){
      const a=tm*1.2+side*0.8;
      const cx=side*s*(1.0+0.12*Math.sin(a)),cy=Math.cos(a)*s*0.42;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(a);
      ctx.fillStyle='rgba('+col+',0.82)';
      ctx.beginPath(); ctx.moveTo(0,-s*0.22); ctx.lineTo(s*0.14,0); ctx.lineTo(0,s*0.22); ctx.lineTo(-s*0.14,0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }else if(o.core==='darkfire'){
    ctx.fillStyle='rgba('+col+',0.82)';
    for(const side of [-1,1]){
      ctx.beginPath(); ctx.moveTo(side*s*0.18,-s*0.65);
      ctx.quadraticCurveTo(side*s*0.45,-s*1.35,side*s*0.58,-s*0.72);
      ctx.quadraticCurveTo(side*s*0.34,-s*0.86,side*s*0.18,-s*0.65); ctx.fill();
    }
  }else if(o.core==='mist'){
    ctx.strokeStyle='rgba('+col+',0.5)'; ctx.lineWidth=Math.max(1,base*0.08);
    for(let i=0;i<3;i++){
      const yy=s*(0.45+i*0.24),w=s*(0.9-i*0.13);
      ctx.beginPath(); ctx.moveTo(-w,yy);
      ctx.quadraticCurveTo(0,yy+s*(0.28+0.08*Math.sin(tm*2+i)),w,yy); ctx.stroke();
    }
  }
  // 連鎖の金フラッシュ
  const gf=Math.max(0,o.goldFlash||0)/0.6;
  if(gf>0){ ctx.fillStyle='rgba(255,215,90,'+(0.5*gf)+')';
    ctx.beginPath(); ctx.arc(0,0,s*(0.9+0.5*gf),0,7); ctx.fill(); }
  ctx.restore();
}
function draw(){
  // チェーンポーズ中はカメラが引いて全体を見せる
  const chainZoom=chainView>0.01;
  const introActive=mode==='intro'&&enemyIntro&&enemyIntro.target;
  const kick=Math.max(0,igniteKick)/0.15;
  const fullSpan=Math.max(W,H);
  const baseView=chainZoom?P.view+(fullSpan-P.view)*chainView:P.view;

  const viewSize=baseView*(1-introFocus*0.36)*(1-kick*0.30);
  TS=CS/viewSize;
  const _r=sparkRunner();
  const normalCam=chainZoom?{x:W/2,y:H/2}:_r?{x:_r.fx+.5,y:_r.fy+.5}:{x:master.fx+.5,y:master.fy+.5};
  const camTarget=introActive?{
    x:normalCam.x+(enemyIntro.target.fx+.5-normalCam.x)*introFocus,
    y:normalCam.y+(enemyIntro.target.fy+.5-normalCam.y)*introFocus
  }:normalCam;
  cam.x+=(camTarget.x-cam.x)*(introActive?0.22:chainZoom?0.12:(_r?0.28:0.18));
  cam.y+=(camTarget.y-cam.y)*(introActive?0.22:chainZoom?0.12:(_r?0.28:0.18));
  const shk=screenShake>0?screenShake*12:0;

  const ox=CS/2-cam.x*TS+shkX, oy=CS/2-cam.y*TS+shkY, S=v=>v*TS, lit=litNorm();
  ctx.fillStyle='#000'; ctx.fillRect(0,0,CS,CS);

  const x0=Math.max(0,Math.floor(cam.x-P.view/2)-1), x1=Math.min(W-1,Math.ceil(cam.x+P.view/2)+1);
  const y0=Math.max(0,Math.floor(cam.y-P.view/2)-1), y1=Math.min(H-1,Math.ceil(cam.y+P.view/2)+1);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const t=grid[y][x], px=ox+S(x), py=oy+S(y);
    const Z=currentTheme().palette[zoneOf(floor)];
    if(t===0){ ctx.fillStyle=Z.floor; ctx.fillRect(px,py,TS-1,TS-1);
               ctx.fillStyle=Z.floorTop; ctx.fillRect(px,py,TS-1,1); }

          ctx.fillStyle=Z.wallTop; ctx.fillRect(px,py,TS-1,TS*0.22); }

  if(showRings){

    }
    for(const e of enemies){
      const ex=ox+S(e.fx+.5), ey=oy+S(e.fy+.5);
      const fl=Math.hypot(e.dir[0],e.dir[1])||1;
      const facing=Math.atan2(e.dir[1]/fl,e.dir[0]/fl);
      const half=(P.fov*Math.PI/180)/2;
      const rad=S(P.torch);
      // 扇形の塗り（半透明）

      ctx.beginPath(); ctx.moveTo(ex,ey);
      ctx.arc(ex,ey,rad,facing-half,facing+half); ctx.closePath(); ctx.fill();

      ctx.strokeStyle=chase?'rgba(255,90,77,.30)':'rgba('+e.coneC+',.22)';

      ctx.beginPath(); ctx.moveTo(ex,ey);

    }
  }
  // 配下
  for(const m of minions){
    if(!showHidden&&!chainZoom&&illum(m.tx,m.ty)<0.04) continue;
    const px=ox+S(m.fx+.5), py=oy+S(m.fy+.5), s=TS*0.27;
    const bob=Math.sin(performance.now()/240+m.fx*2+m.fy)*s*0.07;
    // 種火持ちは金色の光を纏う + 頭上に炎 + 火の粉の軌跡
    if(m.spark){
      const sg=ctx.createRadialGradient(px,py,0,px,py,S(2.2));
      sg.addColorStop(0,'rgba(255,200,80,0.35)');
      sg.addColorStop(1,'rgba(255,200,80,0)');
      ctx.fillStyle=sg; ctx.fillRect(px-S(2.5),py-S(2.5),S(5),S(5));
      // 火の粉の軌跡
      for(let pi=0;pi<4;pi++){
        const age=((performance.now()/80+pi*40+m.fx*10)%100)/100;
        const ppx=px-(m.fx-m.tx)*TS*age*0.6+(Math.sin(pi*7+age*10))*3;
        const ppy=py-(m.fy-m.ty)*TS*age*0.6-age*8;
        ctx.fillStyle='rgba(255,200,80,'+(0.7*(1-age))+')';
        ctx.beginPath(); ctx.arc(ppx,ppy,1.5*(1-age)+0.5,0,7); ctx.fill();
      }
    }
    ctx.fillStyle='#0c0c11'; ctx.beginPath(); ctx.ellipse(px,py+s*0.95,s*0.8,s*0.3,0,0,7); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px-s*0.78,py+s*0.85+bob); ctx.lineTo(px-s*0.46,py-s*0.72+bob);
    ctx.lineTo(px+s*0.46,py-s*0.72+bob); ctx.lineTo(px+s*0.78,py+s*0.85+bob);
    ctx.closePath(); ctx.fillStyle=m.spark?'#8a6a28':(lit>0.4?'#6a4f38':'#3e3025'); ctx.fill();
    ctx.fillStyle=m.spark?'rgba(255,230,130,0.9)':'rgba(255,206,130,'+(0.55+0.45*lit)+')';
    ctx.fillRect(px-s*0.34,py-s*0.36+bob,s*0.22,s*0.18);
    ctx.fillRect(px+s*0.12,py-s*0.36+bob,s*0.22,s*0.18);
    // 種火持ちの頭上に炎
    if(m.spark){
      const fp=Math.sin(performance.now()/120+m.fx)*0.3;
      const fy2=py-s*1.1+bob;
      ctx.fillStyle='rgba(255,196,107,0.9)';
      ctx.beginPath();
      ctx.moveTo(px-s*0.25+fp,fy2);
      ctx.quadraticCurveTo(px+fp,fy2-s*1.1,px+s*0.25+fp,fy2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.moveTo(px-s*0.1+fp,fy2);
      ctx.quadraticCurveTo(px+fp,fy2-s*0.6,px+s*0.1+fp,fy2);
      ctx.closePath(); ctx.fill();
    }
    if(m.hp<P.mHp*0.999){
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(px-s*0.6,py-s*1.15,s*1.2,2);
      ctx.fillStyle='rgba(255,196,107,.65)'; ctx.fillRect(px-s*0.6,py-s*1.15,s*1.2*(m.hp/P.mHp),2);
    }
  }
  // 侵入者
  for(const e of enemies){          // 火を持つ者は壁越しでも見える
    const etm=performance.now()/1000;
    const gait=e.type==='B'?Math.sin(etm*3+e.fx)*TS*0.035:e.type==='H'?Math.sin(etm*10+e.fy)*TS*0.025:e.type==='R'?Math.sin(etm*7+e.fx*3)*TS*0.05:0;
    const side=e.type==='R'?Math.sin(etm*5.3+e.fy*2)*TS*0.08:0;
    const px=ox+S(e.fx+.5)+e.shake*TS+side, py=oy+S(e.fy+.5)+gait;
    const s=TS*(e.type==='B'?0.43:e.type==='H'?0.30:e.type==='R'?0.35:0.34), hot=e.state==='chase';
    e._drawn=true;
    const fl=Math.hypot(e.dir[0],e.dir[1])||1;
    const edx=e.dir[0]/fl, edy=e.dir[1]/fl;
    const bodyW=e.type==='B'?1.25:e.type==='H'?0.58:e.type==='R'?0.9:0.96;
    const lean=e.type==='H'?edx*s*0.30:0;
    ctx.fillStyle='#0c0c11'; ctx.beginPath(); ctx.ellipse(px,py+s,s*(e.type==='B'?1.15:0.9),s*(e.type==='B'?0.42:0.32),0,0,7); ctx.fill();
    ctx.fillStyle=hot?'#7d2f2b':`rgba(${e.coneC},${e.type==='R'?0.34:0.26})`;
    if(e.type==='H'){
      ctx.beginPath(); ctx.moveTo(px+lean,py-s*1.25); ctx.lineTo(px+s*bodyW,py+s*0.9); ctx.lineTo(px-s*bodyW,py+s*0.9); ctx.closePath(); ctx.fill();
    }else{
      ctx.fillRect(px-s*bodyW*0.5+lean,py-s*(e.type==='B'?1.05:1.15),s*bodyW,s*(e.type==='B'?2.0:2.1));

    }else ctx.fillRect(px-s*(e.type==='B'?0.46:0.38)+headOx+lean,py-s*(e.type==='B'?1.48:1.60)+headOy,s*(e.type==='B'?0.92:0.76),s*(e.type==='B'?0.62:0.52));

    ctx.fillStyle=hot?'#ff4433':`rgba(${e.coneC},1)`; ctx.fillRect(px-s*0.30+visorOx+lean,py-s*1.42+headOy,s*0.60,s*0.13);
    ctx.fillStyle='#10151d'; ctx.fillRect(px-s*0.27+visorOx+lean,py-s*1.40+headOy,s*0.54,s*0.09);
    const j=(e.adj>0)?Math.sin(performance.now()/45)*s*0.22:0;
    e._tx=px+edx*s*(e.type==='H'?1.2:0.95)+j; e._ty=py-s*0.5+edy*s*0.5;
    ctx.fillStyle=`rgba(${e.coneC},0.45)`; ctx.fillRect(e._tx-s*(e.type==='H'?0.06:0.1),e._ty,s*(e.type==='H'?0.12:0.2),s*(e.type==='H'?1.08:0.9));
    ctx.fillStyle='rgba('+e.coneC+',0.28)'; ctx.beginPath(); ctx.arc(e._tx,e._ty-2,8,0,7); ctx.fill();
    ctx.fillStyle='rgba('+e.coneC+',0.9)'; ctx.beginPath(); ctx.arc(e._tx,e._ty-2,3.2,0,7); ctx.fill();
    if(e.hp<(e.maxHp||P.eHp)*0.999){
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(px-s*0.55,py-s*1.75,s*1.1,2);
      ctx.fillStyle='rgba(255,90,77,.75)'; ctx.fillRect(px-s*0.55,py-s*1.75,s*1.1*(e.hp/(e.maxHp||P.eHp)),2);
    }
    if(e.douse>0){
      ctx.lineWidth=Math.max(2,TS*0.08); ctx.strokeStyle='rgba(158,200,238,.8)';
      ctx.beginPath(); ctx.arc(px,py,TS*0.44,-Math.PI/2,-Math.PI/2+7*(e.douse/P.loseSec)); ctx.stroke();
    }
    // 炎上（真の姿の接触）：体から炎が立ち上る
    if(e.burnT>0){
      const tm=performance.now()/1000;
      glow(px,py-s*0.8,S(0.9),'rgba(255,150,60,%A%)',0.28);
      for(let i=0;i<3;i++){
        const fl=0.7+0.3*Math.sin(tm*9+i*2.1);
        const bx=px+Math.sin(tm*7+i*2.7)*s*0.22+(i-1)*s*0.32;
        const bh=s*(0.55+0.4*fl);
        const by=py-s*1.05;
        ctx.fillStyle='rgba(255,'+(120+i*45)+',60,'+(0.55*fl*Math.min(1,e.burnT))+')';
        ctx.beginPath();
        ctx.moveTo(bx,by-bh);
        ctx.quadraticCurveTo(bx+s*0.17,by-bh*0.3,bx,by);
        ctx.quadraticCurveTo(bx-s*0.17,by-bh*0.3,bx,by-bh);
        ctx.fill();
      }
    }
  }
  // マスター（段階進化・ハイブリッド）
  {
    const px=ox+S(master.fx+.5), py=oy+S(master.fy+.5), s=TS*0.34;
    // 視線＝移動方向へ滑らかに寄る。傾き＝進行方向へ僅かに
    const tgx=(master.dir?master.dir[0]:0)*1.1, tgy=(master.dir?master.dir[1]:0)*0.8+0.25;
    master._lx=(master._lx||0)+(tgx-(master._lx||0))*0.12;

    const moving=master.t<1?1:0;

    if(!breathHeld && mode==='play'){
      if(!master._fireflies) master._fireflies=[];

      const ffMax=trueF?12+Math.floor(Math.random()*6):2+Math.floor(Math.random()*5);
      while(ff.length<ffMax){
        const a=Math.random()*Math.PI*2;
        const r=(trueF?0.25:0.15)+Math.random()*(trueF?0.75:0.45);  // 真の姿は広く舞う
        ff.push({
          ang:a, rad:r,
          driftA:Math.random()*0.003-0.0015,  // 角度のゆらぎ速度
          driftR:Math.random()*0.002-0.001,   // 半径のゆらぎ速度
          life:0, maxLife:1.5+Math.random()*3, // 寿命バラバラ
          size:Math.random()<(trueF?0.35:0.2) ? (trueF?3.2:2.5)+Math.random()*2 : 0.8+Math.random()*(trueF?2.2:1.5),
          white:Math.random()<(trueF?0.35:0.22),  // 白っぽいチラ光を混ぜる
          tw:5+Math.random()*4,                    // 白粒の明滅速度（速い）
          phase:Math.random()*Math.PI*2
        });
      }
      for(let i=ff.length-1;i>=0;i--){
        const f=ff[i];
        f.life+=1/60;
        f.ang+=f.driftA+Math.sin(f.life*1.7+f.phase)*0.008;
        f.rad+=f.driftR*Math.sin(f.life*2.3);
        f.rad=Math.max(0.15,Math.min(1.0,f.rad));
        // 寿命でフェードイン・フェードアウト
        const lifeRatio=f.life/f.maxLife;
        const fade=lifeRatio<0.15 ? lifeRatio/0.15
                  :lifeRatio>0.75 ? (1-lifeRatio)/0.25
                  :1;
        // 白粒＝速く鋭い明滅（チラッ）。琥珀粒＝ゆったり
        const flicker=f.white
          ? Math.pow(0.5+0.5*Math.sin(f.life*f.tw+f.phase),2.2)
          : 0.5+0.5*Math.sin(f.life*4+f.phase);
        const alpha=fade*flicker;
        if(alpha<0.05){ if(f.life>=f.maxLife){ ff.splice(i,1); } continue; }
        const fx=px+Math.cos(f.ang)*S(master.r*f.rad);
        const fy=py+Math.sin(f.ang)*S(master.r*f.rad);
        ctx.fillStyle=f.white
          ? 'rgba(255,252,242,'+alpha*0.95+')'
          : 'rgba(255,230,160,'+alpha*0.85+')';
        ctx.beginPath(); ctx.arc(fx,fy,f.size,0,7); ctx.fill();
        // 大粒、または白粒が瞬いた瞬間だけ十字の光芒
        if(f.size>2.0||(f.white&&flicker>0.72)){
          ctx.strokeStyle=f.white
            ? 'rgba(255,255,250,'+alpha*0.45+')'
            : 'rgba(255,240,200,'+alpha*0.35+')';
          ctx.lineWidth=0.7;
          const cr=Math.max(f.size,1.4)*2.5;
          ctx.beginPath(); ctx.moveTo(fx-cr,fy); ctx.lineTo(fx+cr,fy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(fx,fy-cr); ctx.lineTo(fx,fy+cr); ctx.stroke();
        }
        if(f.life>=f.maxLife) ff.splice(i,1);
      }
      // ---- 真の姿だけの祝祭 ----
      if(trueF){
        const tm=performance.now()/1000;
        // 立ち昇る火の粉：核から生まれ、揺れながら昇り、白熱→琥珀→残り火へ冷める
        if(!master._embers) master._embers=[];
        const em=master._embers;
        while(em.length<14){
          em.push({
            x:(Math.random()-0.5)*0.45, y:Math.random()*0.25-0.05,
            vx:(Math.random()-0.5)*0.10, vy:-(0.28+Math.random()*0.40),
            life:Math.random()*0.5, maxLife:0.9+Math.random()*1.2,
            size:0.9+Math.random()*2.3, phase:Math.random()*Math.PI*2
          });
        }
        for(const e of em){
          e.life+=1/60;
          if(e.life>=e.maxLife){
            e.x=(Math.random()-0.5)*0.45; e.y=Math.random()*0.25-0.05;
            e.vx=(Math.random()-0.5)*0.10; e.vy=-(0.28+Math.random()*0.40);

            continue;

          e.x+=e.vx/60+Math.sin(e.life*5+e.phase)*0.004;
          e.y+=e.vy/60;
          const lr=e.life/e.maxLife;
          const al=(lr<0.12?lr/0.12:1-Math.pow(Math.max(0,(lr-0.5))/0.5,1.4))
                   *(0.55+0.45*Math.sin(e.life*7+e.phase));
          if(al<=0.04) continue;
          const exx=px+S(e.x), eyy=py+S(e.y);
          const c=lr<0.25?'255,248,220':lr<0.6?'255,205,110':'255,120,60';
          ctx.fillStyle='rgba('+c+','+al*0.9+')';
          ctx.beginPath(); ctx.arc(exx,eyy,e.size*(1-lr*0.4),0,7); ctx.fill();

        ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(px,py);

        for(let i=0;i<4;i++){
