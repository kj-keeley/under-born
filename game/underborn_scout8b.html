<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>UNDERBORN（アンダーボーン）</title>
<style>
  :root{
    --amber:#ffc46b; --cold:#9ec8ee; --ink:#e8e2d6; --dim:#7d7566;
    --panel:rgba(10,9,12,.88); --line:rgba(255,196,107,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#050508;color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;
    overscroll-behavior:none}
  #wrap{max-width:600px;margin:0 auto;padding:10px 10px 28px}
  header{display:flex;align-items:baseline;gap:10px;padding:2px 2px 6px}
  header h1{font-size:12px;font-weight:500;letter-spacing:.14em;margin:0;color:var(--dim)}
  header span{font-size:10px;color:#4a463d;letter-spacing:.08em}
  #status{height:22px;display:flex;align-items:center;gap:8px;font-size:12px;
    letter-spacing:.06em;padding-left:2px;transition:color .3s}
  #status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;
    box-shadow:0 0 8px currentColor;flex:none}
  #floorProgress{margin-left:auto;padding-right:2px;font-size:10px;color:#5f594f;
    font-variant-numeric:tabular-nums;letter-spacing:.1em}
  #stage{position:relative;width:100%;aspect-ratio:1/1;background:#000;
    border:1px solid rgba(255,255,255,.06);border-radius:2px;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;background:rgba(4,3,6,.9);padding:24px;z-index:10;overflow-y:auto}
  #overlay.show{display:flex}
  #pauseOverlay{position:absolute;inset:0;display:none;z-index:20;align-items:center;
    justify-content:center;background:rgba(3,2,7,.88);padding:24px;text-align:center}
  #pauseOverlay.show{display:flex}
  .pause-card{width:min(100%,340px);padding:24px 20px;border:1px solid var(--line);
    background:rgba(10,9,15,.96);box-shadow:0 18px 48px rgba(0,0,0,.7)}
  .pause-card h2{margin:0 0 18px;font-size:15px;font-weight:500;letter-spacing:.22em;color:var(--amber)}
  .pause-info{font-size:12px;line-height:2;color:#b9b2a3;margin-bottom:18px}
  .pause-info b{color:var(--ink)}
  .pause-actions{display:grid;gap:8px}
  .pause-warn{margin:12px 0 0;font-size:10px;line-height:1.6;color:#746d61}
  #overlay h2{margin:0;font-size:15px;font-weight:500;letter-spacing:.2em;color:var(--amber)}
  #overlay p{margin:0;font-size:12px;line-height:1.9;color:#a49c8c}
  #xsec{display:none;margin:4px auto;border-radius:4px;max-height:38vh;width:auto}
  #overlay b{color:var(--ink)}
  .theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(100%,420px)}
  .theme-choice{padding:11px 8px;text-align:left;color:var(--ink);border-color:rgba(255,196,107,.2)}
  .theme-choice b{display:block;color:var(--amber);font-size:12px;margin-bottom:4px}
  .theme-choice span{display:block;color:#777064;font-size:10px;line-height:1.45}
  .core-choice{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
  .core-choice b,.core-choice span{text-align:left}
  .core-sigil{width:28px;height:28px;border-radius:50%;border:2px solid var(--core-color);
    background:radial-gradient(circle at 50% 45%,var(--core-color),rgba(8,7,12,.95) 64%);
    box-shadow:0 0 12px color-mix(in srgb,var(--core-color) 45%,transparent)}
  .choice-back{width:min(100%,420px);padding:8px;color:var(--dim);font-size:10px}
  .progress-line{width:min(100%,420px);font-size:10px;line-height:1.7;color:#8f887a;margin-bottom:8px}
  .loop-box{width:min(100%,420px);padding:12px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
  .loop-box input{width:100%;accent-color:var(--amber)}
  #overlay.hole{justify-content:flex-end;background:linear-gradient(transparent 35%,rgba(3,2,7,.55) 68%,rgba(3,2,7,.96));padding-bottom:38px}
  #overlay.ending{background:rgba(3,2,7,.72)}
  @media(max-width:430px){.theme-grid{grid-template-columns:1fr}.theme-choice{padding:9px 8px}}
  #controls{display:flex;gap:8px;margin-top:8px}
  button{font:inherit;font-size:13px;letter-spacing:.08em;color:var(--ink);
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
    border-radius:2px;padding:13px 10px;cursor:pointer;transition:background .18s,color .18s}
  button:active{background:rgba(255,255,255,.09)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  #breathBtn{flex:2}
  #pinBtn{flex:1;color:var(--amber);border-color:rgba(255,196,107,.24)}
  #pinBtn.hot{color:#1a1206;background:var(--amber);border-color:var(--amber);
    box-shadow:0 0 26px rgba(255,196,107,.24)}
  #breathBtn.hot{color:#1a1206;background:#5588aa;border-color:#5588aa;
    box-shadow:0 0 26px rgba(255,196,107,.24)}
  #panelBtn{flex:none;width:60px;color:var(--dim);font-size:11.5px}
  #devDock{position:fixed;top:8px;right:8px;z-index:40}
  #devDock #panelBtn{background:rgba(10,9,12,.92)}
  #trueBtn2{flex:none;width:86px;color:var(--dim);font-size:10.5px;padding-left:5px;padding-right:5px}
  #trueBtn2.on{color:#1a1206;background:var(--amber);border-color:var(--amber);
    box-shadow:0 0 22px rgba(255,196,107,.35)}
  #pauseBtn{flex:none;width:60px;color:var(--dim);font-size:11px}
  #devBadge{position:fixed;left:6px;bottom:6px;z-index:100;pointer-events:none;
    padding:3px 6px;border:1px solid rgba(255,196,107,.45);background:rgba(6,5,9,.88);
    color:var(--amber);font-size:9px;letter-spacing:.16em}
  #panel{position:fixed;top:50px;right:8px;width:min(420px,calc(100vw - 16px));
    max-height:70vh;overflow-y:auto;overscroll-behavior:contain;z-index:39;
    background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 48px rgba(0,0,0,.58);
    border-radius:2px;padding:4px 12px 12px;display:none}
  #panel.open{display:block}
  .grp{display:flex;width:100%;align-items:center;justify-content:space-between;margin-top:8px;
    padding:9px 8px;font-size:10px;letter-spacing:.12em;color:#8f887a;text-align:left}
  .grp.open{color:var(--amber);border-color:rgba(255,196,107,.35)}
  .grp .arrow{display:inline-block;transition:transform .15s}
  .grp.open .arrow{transform:rotate(90deg)}
  .grpRows[hidden]{display:none}
  .row{display:grid;grid-template-columns:1fr 46px;align-items:center;gap:8px;
    padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .row label{font-size:11.5px;color:#b9b2a3}
  .row .val{font-size:12px;color:var(--amber);text-align:right;font-variant-numeric:tabular-nums}
  .row input[type=range]{grid-column:1/3;width:100%;margin:5px 0 0;accent-color:var(--amber);height:18px}
  .note{font-size:10.5px;color:#5c574c;line-height:1.6;padding-top:10px}
  .toggles{display:flex;gap:8px;padding-top:6px;flex-wrap:wrap}
  .toggles button{flex:1 1 44%;font-size:11.5px;padding:9px 4px;color:var(--dim)}
  .toggles button.on{color:var(--amber);border-color:rgba(255,196,107,.4)}
  #log{font-size:11px;color:#8f887a;line-height:1.7;padding:10px 2px 0;font-variant-numeric:tabular-nums}
  #log b{color:var(--ink);font-weight:600}
  #hint{font-size:10.5px;color:#4a463d;line-height:1.7;padding:8px 2px 0}
  body.cinematic header,body.cinematic #status,body.cinematic #controls,
  body.cinematic #log,body.cinematic #hint{display:none}
  body.cinematic #wrap{padding-top:10px}
  body.cinematic #stage{border-color:rgba(255,196,107,.12);box-shadow:0 0 40px rgba(0,0,0,.8)}
</style>
</head>
<body>
<div id="wrap">
  <header><h1>UNDERBORN</h1></header>
  <div id="status"><span class="dot"></span><span id="statusText">潜伏中</span><span id="floorProgress">1 / 50</span></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay"><h2 id="ovTitle"></h2><canvas id="xsec"></canvas><p id="ovBody"></p><div id="coinDisp" style="display:none;font-size:28px;color:#ffd75a;text-align:center;margin:8px 0"></div><button id="ovBtn">続ける</button></div>
    <div id="pauseOverlay"><div class="pause-card">
      <h2>ひとやすみ</h2>
      <div id="pauseInfo" class="pause-info"></div>
      <div class="pause-actions"><button id="resumeBtn">再開</button><button id="quitToTitleBtn">中断してタイトルへ</button></div>
      <p class="pause-warn">中断しても、最後に打ったハーケンは残ります。ここではセーブしません。</p>
    </div></div>
  </div>
  <div id="controls">
    <button id="breathBtn">息を止める (長押し)</button>
    <button id="pinBtn">ハーケン</button>
    <button id="trueBtn2" style="display:none">真の姿</button>
    <button id="pauseBtn">一時停止</button>
  </div>
  <div id="log"></div>
  <p id="hint">スワイプまたは矢印キーで移動（押している間ずっと進む）。マスターをタップで光を1段縮める／長押しで1段広げる。<br>
  祭壇の隣に立ち止まると、住民の冷たい火が自分の火に変わる。自分の火からは配下が生まれる。<br>
  住民は自分の火を消しに来る。すべての祭壇が自分の火になれば、この階を取り戻す。</p>
</div>
<script>
"use strict";
const DEV_STORAGE_KEY='underborn_dev_enabled_v1';
const DEV_DEFAULT=true; // 一般配布用ビルドでは、この1行だけ false に戻す。
const devQuery=new URLSearchParams(location.search).get('dev');
let persistentDev=null;
try{
  const saved=localStorage.getItem(DEV_STORAGE_KEY);
  persistentDev=saved==='0'||saved==='1'?saved:null;
}catch(e){}
const DEV=devQuery==='0'?false:devQuery==='1'?true:persistentDev!==null?persistentDev==='1':DEV_DEFAULT;
function setPersistentDev(enabled){
  try{
    const saved=enabled?'1':'0';
    localStorage.setItem(DEV_STORAGE_KEY,saved);
    persistentDev=saved;
    return true;
  }catch(e){ return false; }
}
/* ============================================================
   v5：視野錐・向き表現・配下減速・広域表示
   消したもの：種／ハート／光を投げる／探索地図／松明の無い敵／撃破数表示／
              光の4段目／比率クリアの残骸／配下の永続強化／3階構造
   戻したもの（1割）：光の中にいる配下は動きが速い
   残した中核：暗闇と点光源の描画（唯一の肯定データ）
   ============================================================ */

let W=24,H=24;
function makeThemeMap(kind){
  const g=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1?'#':'.'));
  const wallH=(y,x1,x2,gaps=[])=>{ for(let x=x1;x<=x2;x++) if(!gaps.includes(x)) g[y][x]='#'; };
  const wallV=(x,y1,y2,gaps=[])=>{ for(let y=y1;y<=y2;y++) if(!gaps.includes(y)) g[y][x]='#'; };
  const fill=(x,y,w,h)=>{ for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++) g[yy][xx]='#'; };
  const box=(x1,y1,x2,y2,doors=[])=>{
    for(let x=x1;x<=x2;x++){ g[y1][x]='#'; g[y2][x]='#'; }
    for(let y=y1;y<=y2;y++){ g[y][x1]='#'; g[y][x2]='#'; }
    for(const [x,y] of doors) g[y][x]='.';
  };
  let altars=[];
  if(kind==='ruins'){
    box(7,3,16,9,[[11,3],[12,3],[7,6],[16,6],[11,9],[12,9]]);
    box(7,14,16,20,[[11,14],[12,14],[7,17],[16,17],[11,20],[12,20]]);
    wallV(4,5,18,[8,11,15]); wallV(19,5,18,[8,12,15]);
    wallH(12,2,8,[5]); wallH(12,15,21,[18]);
    altars=[[3,3],[20,3],[11,6],[12,17],[3,20],[20,20]];
  }else if(kind==='swamp'){
    fill(3,3,3,2); fill(17,3,4,2); fill(9,8,2,4); fill(13,12,2,4);
    fill(3,11,4,3); fill(17,10,4,3); fill(7,18,3,3); fill(14,18,3,3);
    wallH(6,2,9,[6]); wallH(7,14,21,[18]); wallV(12,2,8,[5]); wallV(11,16,21,[19]);
    altars=[[2,4],[21,4],[7,9],[16,14],[3,19],[20,19]];
  }else if(kind==='desert'){
    wallH(4,2,18,[6,13]); wallH(8,5,21,[10,18]); wallH(12,2,18,[4,14]);
    wallH(16,5,21,[8,17]); wallH(20,2,18,[6,12]);
    fill(20,2,2,3); fill(2,9,2,2); fill(20,13,2,2); fill(2,17,2,2);
    altars=[[3,2],[18,6],[6,10],[17,14],[5,18],[20,21]];
  }else if(kind==='forest'){
    fill(3,3,3,3); fill(9,2,3,4); fill(17,3,4,3); fill(6,8,4,3);
    fill(14,8,3,4); fill(2,14,4,3); fill(9,14,4,4); fill(18,14,3,3);
    fill(5,20,4,2); fill(15,19,4,3); wallV(22,7,12,[10]);
    altars=[[2,2],[21,2],[12,7],[7,13],[21,18],[11,21]];
  }else{
    box(3,3,20,20,[[11,3],[12,3],[3,11],[3,12],[20,11],[20,12],[11,20],[12,20]]);
    box(7,7,16,16,[[11,7],[12,7],[7,11],[7,12],[16,11],[16,12],[11,16],[12,16]]);
    fill(10,10,4,4); wallH(5,5,18,[8,15]); wallH(18,5,18,[9,14]);
    altars=[[2,6],[21,6],[6,11],[17,12],[6,21],[17,21]];
  }
  for(const [x,y] of altars) g[y][x]='T';
  return g.map(r=>r.join(''));
}
function makeVerticalMap(variant=0){
  const w=12,h=48;
  const g=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>x===0||y===0||x===w-1||y===h-1?'#':'.'));
  const wallH=(y,gap)=>{ for(let x=1;x<w-1;x++) if(x!==gap) g[y][x]='#'; };
  const gapSets=[[2,9,3,8,4],[8,3,9,2,7],[4,8,2,9,5],[9,4,8,3,7],[3,8,4,9,2]];
  const gaps=gapSets[variant%gapSets.length];
  [40,32,24,16,8].forEach((y,i)=>wallH(y,gaps[i]));
  const cols=[6,4,7,5,7].map((x,i)=>Math.max(2,Math.min(9,x+((variant+i)%3)-1)));
  [[42,45,44],[34,38,36],[26,30,28],[18,22,20],[10,14,12]].forEach((r,i)=>{
    for(let y=r[0];y<=r[1];y++) if(y!==r[2]) g[y][cols[i]]='#';
  });
  const flip=variant%2===1;
  const altars=[[flip?9:2,44],[flip?2:9,37],[flip?9:2,29],[flip?2:9,21],[flip?9:2,13],[flip?2:9,5]];
  for(const [x,y] of altars) g[y][x]='T';
  return g.map(r=>r.join(''));
}
function makeLMap(variant=0){
  const w=28,h=28;
  const g=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>x===0||y===0||x===w-1||y===h-1?'#':'.'));
  const mirror=x=>variant?27-x:x;
  const wallH=(y,x1,x2,gaps=[])=>{ for(let x=x1;x<=x2;x++) if(!gaps.includes(x)) g[y][x]='#'; };
  const wallV=(x,y1,y2,gaps=[])=>{ for(let y=y1;y<=y2;y++) if(!gaps.includes(y)) g[y][x]='#'; };
  // 上側の一角を完全に埋め、左（variant 1は右）と下の二本の腕だけを残す。
  for(let y=1;y<=13;y++) for(let x=15;x<=26;x++) g[y][mirror(x)]='#';
  if(!variant){
    wallH(7,2,12,[5,10]); wallV(7,9,17,[12,16]);
    wallH(18,2,25,[5,13,21]); wallV(18,16,25,[20,24]);
  }else{
    wallH(7,15,25,[17,22]); wallV(20,9,17,[12,16]);
    wallH(18,2,25,[6,14,22]); wallV(9,16,25,[20,24]);
  }
  const baseAltars=[[3,3],[11,4],[4,11],[11,16],[20,20],[24,25]];
  for(const [bx,y] of baseAltars){ const x=mirror(bx); g[y][x]='T'; }
  return g.map(r=>r.join(''));
}
function makeWideMap(variant=0){
  const w=34,h=34;
  const g=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>x===0||y===0||x===w-1||y===h-1?'#':'.'));
  const wallH=(y,x1,x2,gaps=[])=>{ for(let x=x1;x<=x2;x++) if(!gaps.includes(x)) g[y][x]='#'; };
  const wallV=(x,y1,y2,gaps=[])=>{ for(let y=y1;y<=y2;y++) if(!gaps.includes(y)) g[y][x]='#'; };
  const shift=variant?2:0;
  wallH(8,2,31,[6+shift,17,28-shift]);
  wallH(17,2,31,[4+shift,13,22,30-shift]);
  wallH(25,2,31,[7,18+shift,27]);
  wallV(9+shift,3,30,[6,13,21,28]);
  wallV(24-shift,3,30,[5,12,20,29]);
  // 中央は広い交差点、四隅は小部屋として危険地帯と退避先を分ける。
  for(let y=13;y<=21;y++) for(let x=14;x<=20;x++){
    if((x===14||x===20||y===13||y===21)&&![[17,13],[17,21],[14,17],[20,17]].some(p=>p[0]===x&&p[1]===y)) g[y][x]='#';
  }
  const altars=[[3,3],[16,4],[30,3],[4,14],[29,19],[3,30],[17,29],[30,30]];
  for(const [x,y] of altars) g[y][x]='T';
  return g.map(r=>r.join(''));
}
const BASE_PATTERNS=[
  {name:'外回り',wps:[[[2,2],[21,2]],[[2,21],[21,21]],[[2,6],[21,6]],[[2,17],[21,17]]],tBranch:'L'},
  {name:'十字',wps:[[[5,2],[5,21]],[[18,2],[18,21]],[[2,8],[2,16]],[[21,7],[21,16]]],tBranch:'R'},
  {name:'中央',wps:[[[10,5],[10,18]],[[13,5],[13,18]],[[5,11],[18,11]],[[5,13],[18,13]]],tBranch:'A'}
];
const VERTICAL_PATTERN={name:'登攀',wps:[[[2,45],[9,3]],[[9,43],[2,5]],[[5,38],[5,10]],[[2,27],[9,27]],[[8,35],[3,12]]],tBranch:'A'};
function verticalFloor(variant){ return {kind:'vertical',label:'縦長',map:makeVerticalMap(variant),start:[5,46],patterns:[VERTICAL_PATTERN],enemyCount:4}; }
function lFloor(variant){
  const mirror=x=>variant?27-x:x;
  const raw=[[[2,2],[12,12]],[[3,25],[25,25]],[[10,3],[10,24]],[[3,16],[25,16]],[[5,10],[24,24]]];
  return {kind:'lshape',label:'L字',map:makeLMap(variant),patterns:[{name:'死角巡回',wps:raw.map(r=>r.map(p=>[mirror(p[0]),p[1]])),tBranch:'R'}],enemyCount:5};
}
function wideFloor(variant){
  return {kind:'wide',label:'大広間',map:makeWideMap(variant),patterns:[{name:'広域包囲',wps:[
    [[2,3],[31,3]],[[2,30],[31,30]],[[3,10],[30,23]],[[30,10],[3,23]],[[5,16],[28,16]],[[16,4],[16,29]]
  ],tBranch:'A'}],enemyCount:6};
}
function makeRestMap(){
  return [
    '############',
    '#..........#',
    '#..........#',
    '#..........#',
    '#..........#',
    '#....T.....#',
    '#..........#',
    '#..........#',
    '#..........#',
    '#..........#',
    '#..........#',
    '############'
  ];
}
const REST_PATTERN={name:'休憩所',wps:[[[2,2],[7,2]],[[2,7],[7,7]],[[2,3],[2,7]],[[7,3],[7,7]]],tBranch:'A'};
const restFloorShape=()=>({kind:'rest',label:'休憩所',map:makeRestMap(),patterns:[REST_PATTERN],start:[5,7]});
const SPECIAL_FLOORS={
  ruins:{},
  swamp:{10:verticalFloor(1),12:lFloor(1)},
  desert:{11:verticalFloor(2),13:wideFloor(0)},
  forest:{10:verticalFloor(3)},
  volcano:{11:verticalFloor(4),17:wideFloor(1)}
};
const CORES={

/* ---------- 幾何 ---------- */
function los(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy, x=x0, y=y0;
  for(let i=0;i<200;i++){
    if(x===x1&&y===y1) return true;
    const e2=2*err;
    if(e2>-dy){ err-=dy; x+=sx; }
    if(e2<dx){ err+=dx; y+=sy; }
    if(x===x1&&y===y1) return true;
    if(grid[y][x]!==0) return false;
  }
  return false;
}
function losA(x0,y0,x1,y1){          // 祭壇は壁の中なので始点だけ免除
  if(x0===x1&&y0===y1) return true;
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy, x=x0, y=y0, first=true;
  for(let i=0;i<200;i++){
    const e2=2*err;
    if(e2>-dy){ err-=dy; x+=sx; }
    if(e2<dx){ err+=dx; y+=sy; }
    if(x===x1&&y===y1) return true;
    if(!first&&grid[y][x]!==0) return false;
    first=false;
  }
  return false;
}
function bfs(sx,sy,gx,gy,blocked){
  const isBlocked=(x,y)=>blocked&&x===blocked[0]&&y===blocked[1]&&!(x===sx&&y===sy);
  if(isWall(gx,gy)||isBlocked(gx,gy)) return null;
  if(sx===gx&&sy===gy) return [];
  const prev=new Int32Array(W*H).fill(-1);
  const start=sy*W+sx, goal=gy*W+gx;
  prev[start]=-2;
  const q=[start]; let head=0;
  while(head<q.length){
    const c=q[head++];
    if(c===goal) break;
    const cx=c%W, cy=(c/W)|0;
    for(const d of DIRS){
      const nx=cx+d[0], ny=cy+d[1];
      if(isWall(nx,ny)||isBlocked(nx,ny)) continue;
      const ni=ny*W+nx;
      if(prev[ni]!==-1) continue;
      prev[ni]=c; q.push(ni);
    }
  }
  if(prev[goal]===-1) return null;
  const path=[]; let c=goal;
  while(c!==start){ path.push([c%W,(c/W)|0]); c=prev[c]; }
  return path.reverse();
}
function freeNear(cx,cy,rad,min){
  for(let i=0;i<50;i++){
    const a=Math.random()*Math.PI*2, r=min+Math.random()*(rad-min);
    const x=Math.round(cx+Math.cos(a)*r), y=Math.round(cy+Math.sin(a)*r);
    if(!isWall(x,y)) return [x,y];
  }
  return null;
}
function farTile(cx,cy,min){
  let best=null,bd=-1;
  for(let i=0;i<250;i++){
    const x=(Math.random()*W)|0, y=(Math.random()*H)|0;
    if(isWall(x,y)) continue;
    const d=dist(x,y,cx,cy);
    if(d>=min) return [x,y];
    if(d>bd){bd=d;best=[x,y];}
  }
  return best||[12,11];
}
function adjOf(a){ return DIRS.map(([dx,dy])=>[a.x+dx,a.y+dy]).filter(([x,y])=>!isWall(x,y)); }

/* ---------- 移動 ---------- */
function mover(x,y,spt){ return {tx:x,ty:y,fx:x,fy:y,px:x,py:y,t:1,spt,path:[],repath:0,dir:[1,0]}; }
function advance(e,dt){
  if(e.t<1){
    e.t=Math.min(1,e.t+dt/e.spt);
    const k=e.t*e.t*(3-2*e.t);
    e.fx=e.px+(e.tx-e.px)*k; e.fy=e.py+(e.ty-e.py)*k;
    if(e.t>=1){ e.px=e.tx; e.py=e.ty; e.fx=e.tx; e.fy=e.ty; }
    return;
  }
  if(e.path&&e.path.length){
    const n=e.path.shift();
    if(!isWall(n[0],n[1])){ e.px=e.tx; e.py=e.ty; e.tx=n[0]; e.ty=n[1]; e.t=0; e.dir=[e.tx-e.px,e.ty-e.py]; }
  }
}
function goTo(e,gx,gy){ const p=bfs(e.tx,e.ty,gx,gy); if(p) e.path=p; }
function warp(e,x,y){ e.tx=e.px=e.fx=x; e.ty=e.py=e.fy=y; e.t=1; e.path=[]; }

function enterEnemyChase(e,target,pos){

  e.path=[]; e.repath=0; e.douse=0;
}
function enterEnemyLook(e,reason,duration=P.search){
  e.state='look'; e.lookReason=reason; e.chaseTarget=null;
  e.timer=duration; e.path=[]; e.repath=0;
  if(reason==='lostMaster'){
    e.lookAnchor=e.last?[e.last[0],e.last[1]]:[e.tx,e.ty];
    e.mark='？'; e.markT=1.6;
  }else e.lookAnchor=null;
}
function enemyBlockedCell(spotted){
  return breathHeld&&!spotted?[master.tx,master.ty]:null;
}
function enemyGoTo(e,gx,gy,spotted){
  const p=bfs(e.tx,e.ty,gx,gy,enemyBlockedCell(spotted));
  e.path=p||[];
  return p;
}
function lostMasterApproachPath(e,spotted){
  if(!e.last) return null;
  const [lx,ly]=e.last;
  let best=null, bestLen=1e9;
  for(let y=ly-2;y<=ly+2;y++) for(let x=lx-2;x<=lx+2;x++){
    const d=Math.abs(x-lx)+Math.abs(y-ly);
    if(d<1||d>2||isWall(x,y)) continue;
    if(x===master.tx&&y===master.ty) continue;
    const p=bfs(e.tx,e.ty,x,y,enemyBlockedCell(spotted));
    if(p&&p.length<bestLen){ best=p; bestLen=p.length; }
  }
  return best;
}
function lostMasterWanderPath(e,spotted){
  const a=e.lookAnchor||e.last;
  if(!a) return null;
  const candidates=[];
  for(let y=a[1]-3;y<=a[1]+3;y++) for(let x=a[0]-3;x<=a[0]+3;x++){
    const d=Math.abs(x-a[0])+Math.abs(y-a[1]);
    if(d<2||d>3||isWall(x,y)||(x===master.tx&&y===master.ty)) continue;
    const p=bfs(e.tx,e.ty,x,y,enemyBlockedCell(spotted));
    if(p&&p.length) candidates.push(p);
  }
  return candidates.length?candidates[(Math.random()*candidates.length)|0]:null;
}
function finishEnemyLook(e,spotted){
  e.state='patrol'; e.chaseTarget=null; e.lookReason=null; e.lookAnchor=null;
  e.last=null; e.alerted=false; e.target=null;
  e.spt=P.ePatrol*0.5*e.speedMul; e._returning=8;
  let bestD=999, bestWi=0;
  for(let wi=0;wi<e.wps.length;wi++){
    const w=e.wps[wi]; if(!w) continue;
    const d=Math.abs(e.tx-w[0])+Math.abs(e.ty-w[1]);
    if(d<bestD){ bestD=d; bestWi=wi; }
  }
  e.wi=bestWi;
  const wp=e.wps[e.wi]; if(wp) enemyGoTo(e,wp[0],wp[1],spotted);
}

/* ---------- 明かり ---------- */
// 住民の火だけが焼き込まれる。自分の火は自分を晒さない
function computeStatic(){
  staticLight=new Float32Array(W*H);
  for(const a of altars){
    if(a.mine) continue;
    for(let y=Math.max(0,a.y-4);y<=Math.min(H-1,a.y+4);y++)
      for(let x=Math.max(0,a.x-4);x<=Math.min(W-1,a.x+4);x++){
        const d=dist(x,y,a.x,a.y);
        if(d>P.altarR) continue;
        if(!losA(a.x,a.y,x,y)) continue;
        const v=1-d/(P.altarR+0.4);
        if(v>staticLight[y*W+x]) staticLight[y*W+x]=v;
      }
  }
}
function illum(x,y){                    // 描くかどうかの判定（自分の火も含む）
  let v=staticLight[y*W+x]||0;
  for(const a of altars){
    const d=dist(x,y,a.x,a.y);
    if(d<=P.altarLit&&losA(a.x,a.y,x,y)) v=Math.max(v,1-d/(P.altarLit+0.4));
  }
  if(glowing()){
    const d=dist(x,y,master.tx,master.ty);
    if(d<=master.r&&los(master.tx,master.ty,x,y)) v=Math.max(v,1-d/(master.r+.5));
  }else if(x===master.tx&&y===master.ty) v=Math.max(v,0.5);
  for(const e of enemies){
    const d=dist(x,y,e.tx,e.ty);
    if(d<=P.torchLit&&los(e.tx,e.ty,x,y)) v=Math.max(v,1-d/(P.torchLit+.5));
  }
  return v;
}

/* ---------- 光 ---------- */
const radii=()=>[P.r0,P.r1,P.r2];
const glowing=()=> master.idx>=1;
const litNorm=()=> Math.max(0,Math.min(1,(master.r-P.r0)/Math.max(0.001,P.r2-P.r0)));
function updateLight(dt){
  const tgt=radii()[master.idx];
  if(Math.abs(master.r-tgt)<0.005){ master.r=tgt; return; }
  const up=tgt>master.r, time=up?P.grow:P.shrink;
  const rate= time<=0?1e9:Math.max(0.001,(P.r2-P.r0)/2)/time;
  master.r+=(up?1:-1)*rate*dt;
  if((up&&master.r>tgt)||(!up&&master.r<tgt)) master.r=tgt;
}

/* ---------- 発見 ---------- */
function inArc(e,tx,ty){
  const dx=tx-e.tx, dy=ty-e.ty, d=Math.hypot(dx,dy);
  if(d<0.7) return true;
  const fl=Math.hypot(e.dir[0],e.dir[1])||1;
  return (dx/d)*(e.dir[0]/fl)+(dy/d)*(e.dir[1]/fl) >= Math.cos((P.fov*Math.PI/180)/2);
}
// 光っている物は全方位から。住民の火の中に立つのも「光っている」に含む
function seesMaster(e){
  const d=dist(e.tx,e.ty,master.tx,master.ty);
  const stand=staticLight[master.ty*W+master.tx]||0;
  const openR=Math.max(glowing()?master.r:0, stand>0.22?P.torch:0);
  // 光の円内なら壁越しでも異変に気づく（視線不要）
  if(openR>0&&d<=openR) return true;
  if(d>P.torch) return false;
  if(!inArc(e,master.tx,master.ty)) return false;
  return los(e.tx,e.ty,master.tx,master.ty);
}
function seesMinion(e,m){
  if(e.ignoresMinions) return false;
  const d=dist(e.tx,e.ty,m.tx,m.ty);
  if(d>P.torch||!los(e.tx,e.ty,m.tx,m.ty)) return false;
  return e.alerted||inArc(e,m.tx,m.ty);
}
const minionSees=(m,e)=> dist(m.tx,m.ty,e.tx,e.ty)<=P.mSight && los(m.tx,m.ty,e.tx,e.ty);

function mShell(s,o){
  o=o||{};
  const verts=o.verts||7, squish=o.squish||1, seed=o.seed||0;
  const pts=[];
  for(let i=0;i<verts;i++){
    const a=i/verts*Math.PI*2;

    pts.push([Math.cos(a)*rr,Math.sin(a)*rr]);

  if(o.cold){ g.addColorStop(0,'#121017'); g.addColorStop(0.52,'#191621'); g.addColorStop(1,'#231e2a'); }
  else{       g.addColorStop(0,'#1a151f'); g.addColorStop(0.52,'#292130'); g.addColorStop(1,'#3d3040'); }
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=Math.max(1,s*0.06);

  ctx.lineWidth=Math.max(0.8,s*0.02); ctx.stroke();
}
function mCracks(s,o){
  o=o||{};

  ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,180,90,'+(0.25+0.75*alpha)+')';
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+0.5;
    ctx.lineWidth=Math.max(1,s*(0.07+0.16*open));
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*s*0.12,Math.sin(a)*s*0.12);

    ctx.stroke();

// 欠けた殻片：殻を破った証。tuck=息止めで身に寄せる
function mChip(s,tm,tuck,orbOfs){

  ctx.lineWidth=Math.max(1,s*0.02); ctx.strokeStyle=tuck?'#3a3040':'#59434e'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s*0.04,s*0.02); ctx.lineTo(s*0.02,-s*0.09);

// 火の瞳：blink 1=開 0=閉
function mEye(s,o){
  o=o||{};

  const lx=(o.lookX||0)*s*0.07, ly=(o.lookY||0)*s*0.05;

  ctx.beginPath(); ctx.ellipse(0,0,s*0.30,h*1.25,0,0,7); ctx.fill();
  ctx.fillStyle='rgba('+color+','+(0.35+0.60*lit)+')';
  ctx.beginPath(); ctx.ellipse(0,0,s*0.21,h,0,0,7); ctx.fill();
  if(blink>0.25){
    ctx.fillStyle='rgba(255,248,224,'+(0.45+0.50*lit)+')';

function mBlink(period,ofs){
  const p=((performance.now()/1000+ofs)%period)/period;

// 本体：段階に応じたマスターを(px,py)に描く。base=標準半径(TS*0.34相当)
function renderMasterBody(px,py,base,stage,lit,o){
  o=o||{};

  const col=dead?'255,80,60':(o.coreColor||'255,196,107');
  const s=base*(stage===1?0.85:stage===3?1.12:stage===4?1.0:1.0);

  if(hold){
    ctx.save(); ctx.translate(px,py);

      const sway=Math.sin(tm*4)*s*.12;
      ctx.fillStyle='rgba('+col+',0.78)';

  }

  ctx.fillStyle='rgba(0,0,0,'+(stage===4?0.45:0.75)+')';

  ctx.fill();

  ctx.save(); ctx.translate(px,py-bob);
  const exhale=Math.max(0,Math.min(1,o.exhale||0));

  const pulse=(1+Math.sin(tm*2.5)*0.05)*(1+beat*0.04)*breatheOut;
  ctx.scale(pulse,pulse);
  if(o.tilt) ctx.rotate(o.tilt);

    // ベイビー：卵。亀裂1本、火は点。よちよち揺れ。殻片なし——まだ何も欠けていない
    ctx.save(); ctx.rotate(Math.sin(tm*2.2)*0.12);
    mShell(s,{verts:8,seed:1});
    mCracks(s,{count:1,open:0.12+0.88*lit,alpha:Math.max(0.3,lit),len:0.5});
    ctx.restore();
    ctx.fillStyle='rgba('+col+','+(0.35+0.65*lit)+')';
    ctx.beginPath(); ctx.arc(0,0,s*0.16,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,248,224,'+(0.45+0.55*lit)+')';
    ctx.beginPath(); ctx.arc(0,0,s*0.07,0,7); ctx.fill();
  }else if(stage===2||stage===3){
    // チャイルド/ロード：転がる石＋火の瞳＋殻片

    ctx.restore();
    mEye(s*(stage===3?1.1:1),{blink,lookX:o.lookX||0,lookY:o.lookY==null?0.3:o.lookY,color:col,lit:Math.max(0.35,lit)});
    if(stage===2) mChip(s,tm,false);
    else for(let i=0;i<3;i++){
      const a=tm*0.7+i*Math.PI*2/3;
      ctx.save(); ctx.translate(Math.cos(a)*s*1.35,Math.sin(a)*s*1.05); ctx.rotate(a+tm*0.5);
      mChip(s*0.9,tm+i,false); ctx.restore();
    }
  }else{
    // 真の姿：殻は砕け、破片が衛星軌道。火の本体が浮く
    for(let i=0;i<6;i++){

    ctx.beginPath(); ctx.arc(0,0,s*0.72,0,7); ctx.fill();

  }

  if(o.core==='swap'){
    for(const side of [-1,1]){
      const a=tm*1.2+side*0.8;
      const cx=side*s*(1.0+0.12*Math.sin(a)),cy=Math.cos(a)*s*0.42;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(a);

      ctx.beginPath(); ctx.moveTo(0,-s*0.22); ctx.lineTo(s*0.14,0); ctx.lineTo(0,s*0.22); ctx.lineTo(-s*0.14,0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }else if(o.core==='darkfire'){
    ctx.fillStyle='rgba('+col+',0.82)';
    for(const side of [-1,1]){
      ctx.beginPath(); ctx.moveTo(side*s*0.18,-s*0.65);
      ctx.quadraticCurveTo(side*s*0.45,-s*1.35,side*s*0.58,-s*0.72);
      ctx.quadraticCurveTo(side*s*0.34,-s*0.86,side*s*0.18,-s*0.65); ctx.fill();
    }
  }else if(o.core==='mist'){
    ctx.strokeStyle='rgba('+col+',0.5)'; ctx.lineWidth=Math.max(1,base*0.08);
    for(let i=0;i<3;i++){

  const gf=Math.max(0,o.goldFlash||0)/0.6;

  ctx.restore();
}

    y:normalCam.y+(enemyIntro.target.fy+.5-normalCam.y)*introFocus

    ctx.fillRect(px-s*0.34,py-s*0.36+bob,s*0.22,s*0.18);

      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(px-s*0.55,py-s*1.75,s*1.1,2);
      ctx.fillStyle='rgba(255,90,77,.75)'; ctx.fillRect(px-s*0.55,py-s*1.75,s*1.1*(e.hp/(e.maxHp||P.eHp)),2);
    }

    renderMasterBody(px,py,s*pinPulseScale,masterStage(),lit,{

      // 真の姿は数も粒も別格。通常は2〜6個を維持
      const ffMax=trueF?12+Math.floor(Math.random()*6):2+Math.floor(Math.random()*5);

          size:Math.random()<(trueF?0.35:0.2) ? (trueF?3.2:2.5)+Math.random()*2 : 0.8+Math.random()*(trueF?2.2:1.5),

          : 'rgba(255,230,160,'+alpha*0.85+')';

        while(em.length<14){
          em.push({
            x:(Math.random()-0.5)*0.45, y:Math.random()*0.25-0.05,
            vx:(Math.random()-0.5)*0.10, vy:-(0.28+Math.random()*0.40),
            life:Math.random()*0.5, maxLife:0.9+Math.random()*1.2,
            size:0.9+Math.random()*2.3, phase:Math.random()*Math.PI*2
          });
        }
        for(const e of em){

          if(e.life>=e.maxLife){

            e.vx=(Math.random()-0.5)*0.10; e.vy=-(0.28+Math.random()*0.40);

            e.size=0.9+Math.random()*2.3; e.phase=Math.random()*Math.PI*2;

          }

          e.y+=e.vy/60;

          const al=(lr<0.12?lr/0.12:1-Math.pow(Math.max(0,(lr-0.5))/0.5,1.4))
                   *(0.55+0.45*Math.sin(e.life*7+e.phase));

          const L=S(0.95)*(0.75+0.25*Math.sin(tm*1.3+i*1.7));
          const g=ctx.createLinearGradient(-Math.cos(a)*L,-Math.sin(a)*L,Math.cos(a)*L,Math.sin(a)*L);
          g.addColorStop(0,'rgba(255,235,180,0)');
          g.addColorStop(0.5,'rgba(255,235,180,0.14)');
          g.addColorStop(1,'rgba(255,235,180,0)');
          ctx.strokeStyle=g; ctx.lineWidth=1.6;
          ctx.beginPath();

          ctx.lineTo(Math.cos(a)*L,Math.sin(a)*L);

        }

        ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(0,0,S(0.35+ringP*0.85),0,7); ctx.stroke();
        ctx.restore();
      }else if(master._embers){ master._embers=null; }
    }
  }
  // 暗闇
  dctx.setTransform(dk.width/CS,0,0,dk.width/CS,0,0);
  dctx.globalCompositeOperation='source-over';
  dctx.fillStyle=chainZoom?'rgba(0,0,0,'+(0.93-chainView*0.55)+')':'rgba(0,0,0,0.93)';
  dctx.fillRect(0,0,CS,CS);
  dctx.globalCompositeOperation='destination-out';
  cutSoft(ox+S(master.fx+.5),oy+S(master.fy+.5),S(P.sightR),0.52);
  for(const a of altars) cut(ox+S(a.x+.5),oy+S(a.y+.5),S(P.altarLit),0.38);
  for(const e of enemies) cut(ox+S(e.fx+.5),oy+S(e.fy+.5),S(P.torchLit),0.42);
  if(glowing()) cut(ox+S(master.fx+.5),oy+S(master.fy+.5),S(master.r+0.6),0.3);
  dctx.globalCompositeOperation='source-over';
  ctx.drawImage(dk,0,0,CS,CS);
  // 色
  ctx.globalCompositeOperation='lighter';
  for(const a of altars) glow(ox+S(a.x+.5),oy+S(a.y+.5),S(P.altarLit*0.95),
      a.mine?'rgba(255,150,60,%A%)':'rgba(150,200,255,%A%)',a.mine?0.30:0.34);
  for(const e of enemies) glow(ox+S(e.fx+.5),oy+S(e.fy+.5),S(P.torchLit*0.95),e.freed?'rgba(255,196,107,%A%)':`rgba(${e.coneC},%A%)`,e.freed?(e.resting?.05:.26):.40);
  if(glowing()) glow(ox+S(master.fx+.5),oy+S(master.fy+.5),S(master.r*0.95+0.8),`rgba(${currentCore().color},%A%)`,0.12+0.24*lit);
  ctx.globalCompositeOperation='source-over';

  // 光の穴：暗闇の上でも、離れた場所から次の行き先を見失わない。
  if(exitHole){
    const px=ox+S(exitHole.x+.5),py=oy+S(exitHole.y+.57),pulse=.88+.12*Math.sin(exitHole.t*2.6);
    glow(px,py,S(.72*pulse),'rgba(255,238,190,%A%)',.24);
    ctx.fillStyle='rgba(255,244,211,'+(.38+.14*pulse)+')'; ctx.beginPath();
    ctx.ellipse(px,py,S(.18)*pulse,S(.34)*pulse,0,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,245,.28)'; ctx.beginPath(); ctx.ellipse(px,py,S(.075),S(.22),0,0,7); ctx.fill();
  }

  // 灯り：火そのものは暗闇の上に描く。壁越しでも見える
  for(const a of altars){
    const px=ox+S(a.x+.5), py=oy+S(a.y+.5), r=TS*0.20;
    const pulse=0.6+0.4*Math.sin(performance.now()/(a.mine?520:900)+a.x+a.y);
    const warm=a.mine;
    // 台座（台形）
    ctx.fillStyle=warm?'rgba(70,38,10,.95)':'rgba(14,24,44,.95)';
    ctx.beginPath();
    ctx.moveTo(px-r*1.6,py+r*1.2); ctx.lineTo(px-r*1.0,py-r*0.4);
    ctx.lineTo(px+r*1.0,py-r*0.4); ctx.lineTo(px+r*1.6,py+r*1.2);
    ctx.closePath(); ctx.fill();
    // 皿
    ctx.fillStyle=warm?'rgba(120,70,20,.9)':'rgba(30,50,80,.9)';
    ctx.beginPath(); ctx.ellipse(px,py-r*0.3,r*1.1,r*0.35,0,0,7); ctx.fill();
    // 炎
    const fh=r*(1.4+0.5*pulse);
    ctx.fillStyle=warm?'rgba(255,196,107,'+(0.65+0.35*pulse)+')'
                      :'rgba(180,215,255,'+(0.55+0.35*pulse)+')';
    ctx.beginPath();
    ctx.moveTo(px-r*0.55,py-r*0.3);
    ctx.quadraticCurveTo(px-r*0.7,py-r*0.3-fh*0.5,px,py-r*0.3-fh);
    ctx.quadraticCurveTo(px+r*0.7,py-r*0.3-fh*0.5,px+r*0.55,py-r*0.3);
    ctx.closePath(); ctx.fill();
    // 芯
    ctx.fillStyle='rgba(255,255,255,'+(0.4+0.5*pulse)+')';
    ctx.beginPath();
    ctx.moveTo(px-r*0.2,py-r*0.3);
    ctx.quadraticCurveTo(px-r*0.25,py-r*0.3-fh*0.35,px,py-r*0.3-fh*0.6);
    ctx.quadraticCurveTo(px+r*0.25,py-r*0.3-fh*0.35,px+r*0.2,py-r*0.3);
    ctx.closePath(); ctx.fill();
  }
  for(const e of enemies){
    const s=TS*0.34;
    const tx = e._drawn ? e._tx : ox+S(e.fx+.5);
    const ty = e._drawn ? e._ty : oy+S(e.fy+.5)-s*0.5;
    const fk=0.9+0.25*Math.sin(performance.now()/130+e.tx);
    const a1 = e._drawn?0.95:0.7;
    const fireC=e.freed?'255,196,107':e.coneC;
    ctx.fillStyle=`rgba(${fireC},${a1*0.45})`;
    ctx.beginPath(); ctx.arc(tx,ty-s*0.2,s*0.62*fk,0,7); ctx.fill();
    ctx.fillStyle=e.freed?'rgba(255,225,160,'+a1+')':'rgba(200,232,255,'+a1+')';
    ctx.beginPath(); ctx.arc(tx,ty-s*0.2,s*0.30*fk,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,'+a1+')';
    ctx.beginPath(); ctx.arc(tx,ty-s*0.2,s*0.14*fk,0,7); ctx.fill();
    e._drawn=false;
  }
  for(const a of altars){                 // 次の配下が生まれるまでの溜まり
    if(!a.mine) continue;
    const px=ox+S(a.x+.5), py=oy+S(a.y+.5);
    const k=1-Math.max(0,Math.min(1,a.born/P.bornSec));
    ctx.lineWidth=Math.max(2,TS*0.07); ctx.strokeStyle='rgba(255,196,107,.38)';
    ctx.beginPath(); ctx.arc(px,py,TS*0.40,-Math.PI/2,-Math.PI/2+7*k); ctx.stroke();
  }
  if(takeTarget){
    const tx=ox+S(takeTarget.x+.5), ty=oy+S(takeTarget.y+.5);
    ctx.lineWidth=Math.max(2,TS*0.09); ctx.strokeStyle='rgba(255,196,107,.9)';
    const _need=Math.max(0.001,igniteNeed());
    ctx.beginPath(); ctx.arc(tx,ty,TS*0.44,-Math.PI/2,-Math.PI/2+7*Math.min(1,takeT/_need)); ctx.stroke();
  }
  for(const m of minions){                // 自分の火から生まれた者は残り火を持つ（床は照らさない）
    const px=ox+S(m.fx+.5), py=oy+S(m.fy+.5), s=TS*0.27;
    const f=0.85+0.3*Math.sin(performance.now()/(m.fighting?70:300)+m.fx*3+m.fy);
    ctx.fillStyle='rgba(255,150,60,.28)';
    ctx.beginPath(); ctx.arc(px,py-s*0.2,s*0.58*f,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,206,130,.85)';
    ctx.beginPath(); ctx.arc(px,py-s*0.2,s*0.20*f,0,7); ctx.fill();
  }

  // ハーケン：暗闇の上でも見失わない、小さな杭と残り火。
  if(campaign.hakenGiven&&activeRun&&activeRun.pin&&activeRun.pin.floor===floor&&!!activeRun.pin.rest===restRoom){
    const p=activeRun.pin,px=ox+S(p.x+.5),py=oy+S(p.y+.5),pulse=.75+.25*Math.sin(performance.now()/240);
    const lighting=pinIgnite&&pinIgnite.floor===floor&&!!pinIgnite.rest===restRoom&&pinIgnite.x===p.x&&pinIgnite.y===p.y?1-Math.max(0,pinIgnite.t)/.4:1;
    glow(px,py,S(.7),'rgba(255,170,70,%A%)',.18*pulse*lighting);
    const hz=TS/20; drawHaken(ctx,px-8.5*hz,py-TS*.06-4*hz,hz);
    if(lighting>0){
      ctx.fillStyle='rgba(255,196,107,'+((.65+.25*pulse)*lighting)+')'; ctx.beginPath();
      ctx.moveTo(px-TS*.08*lighting,py-TS*.06); ctx.quadraticCurveTo(px,py-TS*.43*pulse*lighting,px+TS*.08*lighting,py-TS*.06); ctx.closePath(); ctx.fill();
    }
  }
  if(pinHolding){
    const px=ox+S(master.fx+.5),py=oy+S(master.fy+.5);
    ctx.lineWidth=Math.max(2,TS*.07); ctx.strokeStyle='rgba(255,196,107,.92)';
    ctx.beginPath(); ctx.arc(px,py,TS*.55,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,pinHold/4)); ctx.stroke();
  }

  // 印
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const e of enemies){
    if(e.markT>0&&e.mark){
      const px=ox+S(e.fx+.5), py=oy+S(e.fy+.5)-TS*0.95-Math.min(8,e.markT*7);
      ctx.font='700 '+Math.round(TS*0.5)+'px ui-monospace,monospace';
      ctx.fillStyle=e.mark==='？'?'rgba(200,210,225,'+Math.min(1,e.markT)+')'
                                 :'rgba(255,90,77,'+Math.min(1,e.markT*1.6)+')';
      ctx.fillText(e.mark,px,py);
    }
  }
  for(const k of marks){
    if(k.ring){
      const pr=(0.5-k.t)/0.5;                      // 0→1で広がる
      ctx.lineWidth=Math.max(1.5,S(0.06)*(1-pr));
      ctx.strokeStyle='rgba(255,215,90,'+(0.8*(1-pr))+')';
      ctx.beginPath(); ctx.arc(ox+S(k.x+.5),oy+S(k.y+.5),S(0.3+pr*1.6),0,7); ctx.stroke();
      continue;
    }
    const px=ox+S(k.x+.5), py=oy+S(k.y+.5)-((k.big?2.4:1.6)-k.t)*TS*0.4;
    ctx.font='700 '+Math.round(TS*(k.big?0.85:0.42))+'px ui-monospace,monospace';
    ctx.fillStyle=k.col+Math.min(0.85,k.t*0.6)+')';
    ctx.fillText(k.txt,px,py);
  }
  // 飛ぶ♥
  for(const h of flyHearts){
    const t=Math.min(1,h.t), e=t*t*(3-2*t);                 // すーっと加速して着く
    let hx=h.x0+(h.tx-h.x0)*e, hy=h.y0+(h.ty-h.y0)*e;
    if(h.kind!=='lose') hy-=Math.sin(Math.PI*t)*1.4;         // ふわっと山なりに飛ぶ
    const px=ox+S(hx), py=oy+S(hy);
    const col=h.kind==='gain'?'255,215,90':h.kind==='pay'?'255,100,80':'255,100,80';
    let sz=h.kind==='gain'?(1.2-0.3*t):(0.7-0.2*t);
    if(h.kind==='gain'&&t>0.75) sz*=1+(t-0.75)*2.2;   // 着く直前ぷくっ
    const al=h.kind==='lose'?(1-t):0.95;
    if(h.kind==='gain'){                                     // 金の尾を引く
      for(let q=1;q<=6;q++){ const tt=Math.max(0,t-q*0.05), ee=tt*tt*(3-2*tt);
        const qx=h.x0+(h.tx-h.x0)*ee, qy=h.y0+(h.ty-h.y0)*ee-Math.sin(Math.PI*tt)*1.4;
        ctx.fillStyle='rgba(255,215,90,'+(0.25/q)+')';
        ctx.beginPath(); ctx.arc(ox+S(qx),oy+S(qy),S(0.18),0,7); ctx.fill(); }
    }
    ctx.font='700 '+Math.round(TS*sz)+'px ui-monospace,monospace';
    ctx.fillStyle='rgba('+col+','+al+')';
    ctx.textAlign='center';
    ctx.fillText('♥',px,py+TS*sz*0.35);
  }
  // 着弾の金の火花（ジャラッ）
  for(const p of sparks){
    ctx.fillStyle='rgba(255,215,90,'+Math.min(0.9,p.t*1.4)+')';
    ctx.beginPath(); ctx.arc(ox+S(p.x),oy+S(p.y),Math.max(1,S(0.07))*(0.5+p.t),0,7); ctx.fill();
  }
  for(const p of pinSparks){
    ctx.fillStyle='rgba(255,155,55,'+Math.min(1,p.t/.3)+')';
    ctx.beginPath(); ctx.arc(ox+S(p.x),oy+S(p.y),Math.max(1,S(.055))*(.6+p.t),0,7); ctx.fill();
  }
  if(pinBanner){
    const a=Math.min(1,(pinBanner.dur-pinBanner.t)/.15,pinBanner.t/.2);
    ctx.fillStyle='rgba(3,2,7,'+(.82*a)+')'; ctx.fillRect(0,CS*.84,CS,CS*.09);
    ctx.fillStyle='rgba(232,226,214,'+a+')'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='500 '+Math.round(CS*.026)+'px ui-monospace,monospace'; ctx.fillText(pinBanner.text,CS/2,CS*.885);
  }

  // ミニマップ（息止めに合わせて0.15秒でフェード）
  if(showMinimap && breathMinimapAlpha>.01){
    ctx.save(); ctx.globalAlpha*=breathMinimapAlpha;
    const mMaxW=Math.round(CS*0.30),mMaxH=Math.round(CS*0.72),mT=Math.min(mMaxW/W,mMaxH/H),mW=W*mT,mH=H*mT,mPad=8;
    const mx=CS-mW-mPad, my=mPad;
    // 背景
    ctx.fillStyle='rgba(4,3,8,.82)'; ctx.fillRect(mx-2,my-2,mW+4,mH+4);
    ctx.strokeStyle='rgba(255,196,107,.18)'; ctx.lineWidth=1;
    ctx.strokeRect(mx-2,my-2,mW+4,mH+4);
    // 地形
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const t=grid[y][x];
      if(t!==0){ ctx.fillStyle='rgba(60,54,65,.9)'; ctx.fillRect(mx+x*mT,my+y*mT,mT,mT); }
    }
    // 祭壇
    for(const a of altars){
      ctx.fillStyle=a.mine?'rgba(255,196,107,.9)':'rgba(158,200,238,.7)';
      ctx.fillRect(mx+a.x*mT-1,my+a.y*mT-1,mT+1,mT+1);
    }
    if(exitHole){
      ctx.strokeStyle='rgba(255,244,211,.95)'; ctx.lineWidth=Math.max(1,mT*.24); ctx.beginPath();
      ctx.ellipse(mx+(exitHole.x+.5)*mT,my+(exitHole.y+.5)*mT,Math.max(1.5,mT*.22),Math.max(2.5,mT*.42),0,0,7); ctx.stroke();
    }
    if(campaign.hakenGiven&&activeRun&&activeRun.pin&&activeRun.pin.floor===floor&&!!activeRun.pin.rest===restRoom){
      ctx.fillStyle='rgba(255,196,107,.95)';
      ctx.fillRect(mx+(activeRun.pin.x+.25)*mT,my+(activeRun.pin.y+.25)*mT,Math.max(2,mT*.5),Math.max(2,mT*.5));
    }
    // 配下（小さい暖色ドット）
    for(const m of minions){
      ctx.fillStyle='rgba(255,170,80,.7)';
      ctx.beginPath(); ctx.arc(mx+(m.fx+.5)*mT,my+(m.fy+.5)*mT,Math.max(1.5,mT*0.3),0,7); ctx.fill();
    }
    // 敵：位置＋向きの線＋視野錐
    for(const e of enemies){
      const ecx=mx+(e.fx+.5)*mT, ecy=my+(e.fy+.5)*mT;
      if(e.freed){
        ctx.fillStyle='rgba(255,196,107,.92)'; ctx.beginPath(); ctx.arc(ecx,ecy,Math.max(2,mT*.42),0,7); ctx.fill();
        continue;
      }
      const efl=Math.hypot(e.dir[0],e.dir[1])||1;
      const ef=Math.atan2(e.dir[1]/efl,e.dir[0]/efl);
      const ehalf=(P.fov*Math.PI/180)/2;
      const erad=P.torch*mT;
      // 視野錐
      ctx.fillStyle=`rgba(${e.coneC},${e.state==='chase'?0.22:0.14})`;
      ctx.beginPath(); ctx.moveTo(ecx,ecy);
      ctx.arc(ecx,ecy,erad,ef-ehalf,ef+ehalf); ctx.closePath(); ctx.fill();
      // 本体：色と形で種別を判別
      const er=Math.max(2,e.type==='B'?mT*0.58:e.type==='H'?mT*0.38:mT*0.45);
      ctx.fillStyle=`rgba(${e.coneC},0.95)`;
      if(e.type==='B') ctx.fillRect(ecx-er,ecy-er,er*2,er*2);
      else if(e.type==='H'){
        ctx.beginPath(); ctx.moveTo(ecx+Math.cos(ef)*er*1.5,ecy+Math.sin(ef)*er*1.5);
        ctx.lineTo(ecx+Math.cos(ef+2.4)*er,ecy+Math.sin(ef+2.4)*er);
        ctx.lineTo(ecx+Math.cos(ef-2.4)*er,ecy+Math.sin(ef-2.4)*er); ctx.closePath(); ctx.fill();
      }else{ ctx.beginPath(); ctx.arc(ecx,ecy,er,0,7); ctx.fill(); }
      if(e.state==='chase'){ ctx.strokeStyle='rgba(255,90,77,.95)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(ecx,ecy,er+2,0,7); ctx.stroke(); }
      // 向き線
      ctx.strokeStyle=`rgba(${e.coneC},0.75)`;
      ctx.lineWidth=Math.max(1,mT*0.2);
      ctx.beginPath(); ctx.moveTo(ecx,ecy);
      ctx.lineTo(ecx+Math.cos(ef)*mT*1.8,ecy+Math.sin(ef)*mT*1.8); ctx.stroke();
    }
    // マスター
    ctx.fillStyle=`rgba(${currentCore().color},0.95)`;
    ctx.beginPath(); ctx.arc(mx+(master.fx+.5)*mT,my+(master.fy+.5)*mT,Math.max(2.5,mT*0.5),0,7); ctx.fill();
    ctx.restore();
  }

  // 画面端の気配（画面外の敵の方向だけ示す三角）
  for(const e of enemies){
    const ex=ox+S(e.fx+.5), ey=oy+S(e.fy+.5);
    const margin=TS*1.5;
    if(ex>=-margin && ex<=CS+margin && ey>=-margin && ey<=CS+margin) continue; // 画面内
    const d=Math.hypot(ex-CS/2,ey-CS/2);
    if(d>S(16)) continue; // 遠すぎる敵は気配も出さない
    const ang=Math.atan2(ey-CS/2,ex-CS/2);
    const edgePad=12;
    const ix=Math.max(edgePad,Math.min(CS-edgePad,CS/2+Math.cos(ang)*(CS/2-edgePad)));
    const iy=Math.max(edgePad,Math.min(CS-edgePad,CS/2+Math.sin(ang)*(CS/2-edgePad)));
    const proximity=1-Math.min(1,d/S(14));
    const col=`rgba(${e.coneC},`;
    ctx.save(); ctx.translate(ix,iy); ctx.rotate(ang);
    ctx.fillStyle=col+(0.15+0.45*proximity)+')';
    ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(-4,-4); ctx.lineTo(-4,4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ニアミス演出（画面端の対角が一瞬光る）
  if(nearMissT>0){
    const na=nearMissT/0.7;
    const gx=CS/2+Math.cos(nearMissAng)*CS*0.3;
    const gy=CS/2+Math.sin(nearMissAng)*CS*0.3;
    const grad=ctx.createRadialGradient(gx,gy,0,gx,gy,CS*0.5);
    grad.addColorStop(0,'rgba(255,220,100,'+(0.18*na)+')');
    grad.addColorStop(1,'rgba(255,220,100,0)');
    ctx.fillStyle=grad; ctx.fillRect(0,0,CS,CS);
  }

  // 祭壇点火パルス
  for(const a of altars){
    if(a._claimFlash && a._claimFlash>0){
      const cf=a._claimFlash;
      const apx=ox+S(a.x+.5), apy=oy+S(a.y+.5);
      const pr=S(2+4*(1-cf));
      const cg=ctx.createRadialGradient(apx,apy,0,apx,apy,pr);
      cg.addColorStop(0,'rgba(255,196,107,'+(0.5*cf)+')');
      cg.addColorStop(0.4,'rgba(255,150,60,'+(0.3*cf)+')');
      cg.addColorStop(1,'rgba(255,120,40,0)');
      ctx.fillStyle=cg; ctx.fillRect(apx-pr,apy-pr,pr*2,pr*2);
      a._claimFlash-=1/60*1.8;
      if(a._claimFlash<=0) a._claimFlash=0;
    }
  }

  // 連鎖カウンター表示
  if(chainMarkT>0 && chainCount>0 && !sparkSelect){
    const ca=Math.min(1,chainMarkT/0.5);
    const scale=1+0.3*(1-ca);
    ctx.save();
    const cGrow=Math.min(4,chainCount);
    const cSize=CS*(0.12+cGrow*0.05)*scale;
    const cR=Math.min(255,220+cGrow*9), cG=Math.max(120,220-cGrow*25), cB=Math.max(60,100-cGrow*10);
    ctx.font='700 '+Math.round(cSize)+'px ui-monospace,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,'+(ca*0.5)+')';
    ctx.fillText(chainCount>1?'連鎖 '+chainCount+'！':'種火！',CS/2+2,CS*0.14+2);
    ctx.fillStyle='rgba('+cR+','+cG+','+cB+','+ca+')';
    ctx.fillText(chainCount>1?'連鎖 '+chainCount+'！':'種火！',CS/2,CS*0.14);
    ctx.restore();
  }

  // 種火選択モード：未点火の祭壇をハイライト + 指示テキスト
  if(sparkSelect){
    const pulse=0.5+0.5*Math.sin(performance.now()/200);
    for(const a of altars){
      if(a.mine) continue;
      const apx=ox+S(a.x+.5), apy=oy+S(a.y+.5);
      // パルスリング
      ctx.strokeStyle='rgba(255,220,100,'+(0.4+0.4*pulse)+')';
      ctx.lineWidth=2+pulse;
      ctx.beginPath(); ctx.arc(apx,apy,S(1.2+0.3*pulse),0,7); ctx.stroke();
    }
    // 指示テキスト
    ctx.save();
    ctx.font='600 '+Math.round(CS*0.04)+'px ui-monospace,monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,220,100,0.9)';
    ctx.fillText('祭壇をタップして行き先を指定（残り'+sparkQueue.length+'体）',CS/2,CS*0.92);
    ctx.restore();
  }

  // チェーンポーズ中は暗闇を薄くする
  if(chainZoom){
    // 暗闇レイヤーの上に半透明で全体を明るくする
    const warmth=Math.min(0.25,0.05+chainCount*0.04);
    ctx.fillStyle='rgba(255,196,107,'+warmth+')'; ctx.fillRect(0,0,CS,CS);

function kanjiNum(value){
  const n=Math.max(0,Math.floor(Number(value)||0));
  if(n===0) return '零';
  const digit=['','一','二','三','四','五','六','七','八','九'];
  const under100=v=>v<10?digit[v]:(v<20?'十'+digit[v%10]:digit[Math.floor(v/10)]+'十'+digit[v%10]);
  if(n<100) return under100(n);

}

function drawCrossSection(xc,floorShown=floor){
  const totalFloors=FLOORS, currentFloor=Math.max(1,Math.min(totalFloors,Math.floor(Number(floorShown)||floor)));
  const visibleRows=Math.min(7,totalFloors);
  const low=Math.max(1,Math.min(currentFloor-Math.floor(visibleRows/2),totalFloors-visibleRows+1));
  const high=low+visibleRows-1;
  const cw=240, ch=220, startY=72, rowH=16, rowGap=3;
  xc.width=cw; xc.height=ch; xc.style.width=cw+'px'; xc.style.height=ch+'px';
  const x=xc.getContext('2d');

  x.fillStyle='#06050c'; x.fillRect(0,0,cw,ch);
  const sky=x.createLinearGradient(0,0,0,34);
  sky.addColorStop(0,'#1a1028'); sky.addColorStop(1,'#0c0a14');
  x.fillStyle=sky; x.fillRect(0,0,cw,34);
  x.fillStyle='#2a2530'; x.fillRect(0,31,cw,3);

  x.textAlign='center'; x.fillStyle='#e8e2d6';
  x.font='600 12px ui-monospace,monospace';
  x.fillText(`現在 ${currentFloor}F / ${totalFloors}F`,cw/2,49);
  x.fillStyle='#8f887a'; x.font='10px ui-monospace,monospace';
  x.fillText(`地上まで ${Math.max(0,totalFloors-currentFloor)}階`,cw/2,63);

  if(high<totalFloors){
    x.fillStyle='rgba(158,200,238,.45)'; x.fillText(`… ${totalFloors-high}階`,cw/2,startY-3);
  }

  for(let i=0;i<visibleRows;i++){
    const D=high-i;
    const fy=startY+i*(rowH+rowGap);
    const lit=D<=currentFloor;
    const here=D===currentFloor;
    const palette=currentTheme().palette,Z=palette[Math.min(zoneOf(D),palette.length-1)];

    x.fillStyle=here?'rgba(255,196,107,.32)':lit?Z.wall:'#14162a';
    x.fillRect(22,fy,cw-44,rowH);
    x.fillStyle=lit?Z.floor:'#0a0c1a';
    x.fillRect(27,fy+3,cw-54,rowH-6);

    if(here){
      x.strokeStyle='#ffc46b'; x.lineWidth=2; x.strokeRect(21,fy-1,cw-42,rowH+2);
      x.fillStyle='#ffc46b'; x.beginPath(); x.arc(cw/2,fy+rowH/2,3.5,0,7); x.fill();
      x.fillStyle='rgba(255,196,107,.22)'; x.beginPath(); x.arc(cw/2,fy+rowH/2,8,0,7); x.fill();
    }else{
      x.fillStyle=lit?'rgba(255,170,80,.55)':'rgba(158,200,238,.55)';
      x.beginPath(); x.arc(cw/2,fy+rowH/2,2.5,0,7); x.fill();
    }

    x.font='9px ui-monospace,monospace';
    x.textAlign='right'; x.fillStyle=here?'#ffc46b':lit?'rgba(255,196,107,.55)':'rgba(158,200,238,.38)';
    x.fillText(D+'F',cw-28,fy+rowH-4);
  }

  if(low>1){
    x.textAlign='center'; x.fillStyle='rgba(255,196,107,.45)';
    x.font='10px ui-monospace,monospace'; x.fillText(`… ${low-1}階`,cw/2,ch-7);
  }
}

const keys=new Set();
let footstepEnabled=true,footstepStep=0;
function playFootstep(){
  const stage=masterStage();
  if(!footstepEnabled||!audioReady||breathHeld||stage===4) return;
  const pitch=stage===2?.85:stage>=3?.7:1;
  tone((footstepStep++%2?1560:1320)*pitch,.035,'sine',.035);

function stepBy(dx,dy){
  if(mode!=='play'||master.t<1||pinHolding) return;
  const nx=master.tx+dx, ny=master.ty+dy;
  if(isWall(nx,ny)){
    if(selectedCore==='mist'&&breathHeld&&!breathAbilityUsed&&ny>=0&&nx>=0&&ny<H&&nx<W&&grid[ny][nx]===1){
      const bx=nx+dx, by=ny+dy;
      if(by>=0&&bx>=0&&by<H&&bx<W&&grid[by][bx]===0){
        warp(master,bx,by); master.dir=[dx,dy]; breathAbilityUsed=true;
        markAt(nx,ny,'霞','rgba(145,225,215,'); screenShake=0.25;
        releaseBreath();
      }
    }
    return;
  }
  // 完全停止でも向きだけは変える。霞の壁抜けは上の壁分岐で従来どおり処理する。
  if(breathHeld&&P.breathMoveRate<=0){ master.dir=[dx,dy]; return; }
  // 速度は1マスの開始時に固定し、途中の息止め・解除・スライダー変更では変えない。
  master.spt=breathHeld?P.mSpeed/P.breathMoveRate:P.mSpeed;
  master.px=master.tx; master.py=master.ty;
  master.tx=nx; master.ty=ny; master.t=0; master.dir=[dx,dy];
  playFootstep();
}
function trySwapWithMinion(tx,ty){
  if(selectedCore!=='swap'||!breathHeld||breathAbilityUsed) return false;
  let target=null,bd=1e9;
  for(const m of minions){
    const d=Math.hypot(m.fx-tx,m.fy-ty);
    if(d<0.95&&d<bd){bd=d;target=m;}
  }
  if(!target) return false;
  const mx=master.tx,my=master.ty,tx2=target.tx,ty2=target.ty;
  warp(master,tx2,ty2); warp(target,mx,my); target.repath=0;
  breathAbilityUsed=true; screenShake=0.35;
  markAt(master.tx,master.ty,'転位','rgba(190,130,255,');
  markAt(target.tx,target.ty,'転位','rgba(190,130,255,');
  if(audioReady){ tone(330,0.12,'sine',0.07); tone(660,0.18,'triangle',0.06,0.08); }
  return true;
}

let devCornerTapCount=0,devCornerTapAt=0;
function handleDevCornerTap(ev){
  if(mode!=='title') return false;
  const r=stage.getBoundingClientRect();
  if(ev.clientX-r.left>Math.min(72,r.width*.18)||ev.clientY-r.top>Math.min(72,r.height*.18)){
    devCornerTapCount=0;
    return false;
  }
  const now=performance.now();
  devCornerTapCount=now-devCornerTapAt<=2500?devCornerTapCount+1:1;
  devCornerTapAt=now;
  if(devCornerTapCount>=5){
    const enabled=!DEV;
    if(setPersistentDev(enabled)) location.reload();
    devCornerTapCount=0;
  }
  return true;
}
function heldDir(){
  if(!held||pinHolding) return null;
  if(Math.hypot(hdx,hdy)<P.stick) return null;
  return Math.abs(hdx)>Math.abs(hdy)?[hdx>0?1:-1,0]:[0,hdy>0?1:-1];
}
stage.addEventListener('pointerdown',ev=>{
  audioInit();
  if(mode==='paused'){ ev.preventDefault(); return; }
  if(handleDevCornerTap(ev)){ ev.preventDefault(); return; }
  if(mode==='title'){ ev.preventDefault(); beginTitleSelection(); return; }
  if(skipTitleOpening()){ ev.preventDefault(); return; }
  if(mode==='goddess'||(mode==='surface'&&goddessScene)||(mode==='pinRespawn'&&goddessScene)){ ev.preventDefault(); handleGoddessPointer(ev); return; }
  if(mode==='won'){ ev.preventDefault(); skipAscentCard(); return; }
  if(mode==='surface'&&surfaceAnim&&surfaceAnim.phase==='residentsFinal'){ ev.preventDefault(); finishResidentFinale(); return; }
  if(mode==='surface'&&surfaceAnim&&surfaceAnim.landPoem){ ev.preventDefault(); advanceLandPoem(); return; }
  if(mode==='poem'){ ev.preventDefault(); skipOpeningPoem(); return; }
  if(mode==='guidance'){ ev.preventDefault(); finishBreathLesson(); return; }
  if(mode==='opening'||mode==='evolutionBlackout'||mode==='pinRespawn'||mode==='won'||mode==='surface'||mode==='spotlight'||mode==='holeChoice'||mode==='ending'||mode==='loopSelect'){ ev.preventDefault(); return; }
  if(ov.classList.contains('show')) return;
  if(pinHolding){ ev.preventDefault(); return; }
  ev.preventDefault();
  if(skipEnemyIntro()) return;

  // 種火選択モード：未点火の祭壇をタップで配下の行き先を指定
  if(sparkSelect && sparkQueue.length>0){
    const r=cv.getBoundingClientRect();
    const viewSize=P.view+(Math.max(W,H)-P.view)*chainView;
    const tsNow=CS/viewSize;
    const tapX=Math.floor((ev.clientX-r.left-(CS/2-cam.x*tsNow))/tsNow);
    const tapY=Math.floor((ev.clientY-r.top-(CS/2-cam.y*tsNow))/tsNow);
    for(const a of altars){
      if(a.mine) continue;
      if(a.x===tapX && a.y===tapY){
        const m=sparkQueue.shift();
        m.sparkTarget=a;
        markAt(a.x,a.y,'→','rgba(255,220,100,');
        if(sparkQueue.length===0){
          // 全配下にターゲットが決まった → 再開
          sparkSelect=false;
          chainPause=1.5; chainMarkT=1.5;
        }
        return;
      }
    }
    return;
  }

  const r2=cv.getBoundingClientRect();
  const tapTx=Math.floor((ev.clientX-r2.left-(CS/2-cam.x*TS))/TS);
  const tapTy=Math.floor((ev.clientY-r2.top-(CS/2-cam.y*TS))/TS);
  if(trySwapWithMinion(tapTx,tapTy)) return;

  sx0=ev.clientX; sy0=ev.clientY; hdx=hdy=0; moved=false; held=true;
  onM=(tapTx===master.tx&&tapTy===master.ty);
  if(onM) lp=setTimeout(()=>{ lp=null; moved=true; holdBreath(); },350);
});
stage.addEventListener('pointermove',ev=>{

  if(mode==='paused'||!held||ov.classList.contains('show')) return;
  hdx=ev.clientX-sx0; hdy=ev.clientY-sy0;

    if(lp){clearTimeout(lp);lp=null;}
    moved=true; onM=false;
    const d=Math.hypot(hdx,hdy), lim=P.stick*2.2;
    if(d>lim){ sx0+=hdx*(1-lim/d); sy0+=hdy*(1-lim/d); hdx=ev.clientX-sx0; hdy=ev.clientY-sy0; }
  }
});

  hearts=Math.max(hearts,3); coinFloor=0; breathHeld=false; breathTimer=0; breathCooldown=0;
  pendingFloorStart=null; evolutionBlackout=null; seenEnemyIntros=new Set(Object.keys(ENEMY_INFO)); enemyIntroQueue=[]; enemyIntro=null;
  ov.classList.remove('show'); setCinematic(false); buildFloor(); invuln=1.2;
};
trueBtn=document.getElementById('trueBtn');
debugAllBtn=document.getElementById('debugAllBtn');
debugAllBtn.onclick=()=>{ debugAllThemes=!debugAllThemes; debugAllBtn.classList.toggle('on',debugAllThemes); debugAllBtn.textContent=debugAllThemes?'全土地デバッグ中':'全土地を自由選択'; refreshJumpThemes(); };
}
function toggleTrueFormDebug(){
  debugTrueForm=!debugTrueForm; forceTrueForm=debugTrueForm||trueFormTimer>0;
  if(trueBtn) trueBtn.classList.toggle('on',debugTrueForm);
  if(trueBtn2) trueBtn2.classList.toggle('on',forceTrueForm);
  if(debugTrueForm&&mode==='play') spawnVanguards();
  else if(!forceTrueForm) spawnQueue.length=0;
}
function updateTrueFormButton(){
  if(!trueBtn2) return;
  const available=debugTrueForm||(campaign.trueFormUnlocked&&campaign.newGamePlus&&selectedCore==='initial');
  trueBtn2.style.display=available?'':'none';
  if(!available) return;
  if(debugTrueForm){ trueBtn2.textContent='真の姿 ∞'; trueBtn2.disabled=false; trueBtn2.style.opacity='1'; }
  else if(trueFormTimer>0){ trueBtn2.textContent='解放中 '+trueFormTimer.toFixed(1)+'s'; trueBtn2.disabled=true; trueBtn2.style.opacity='1'; }
  else if(trueFormCooldown>0){ trueBtn2.textContent='再燃 '+trueFormCooldown.toFixed(0)+'s'; trueBtn2.disabled=true; trueBtn2.style.opacity='.35'; }
  else{ trueBtn2.textContent='真の姿 '+trueFormStats().duration.toFixed(0)+'s'; trueBtn2.disabled=false; trueBtn2.style.opacity='1'; }
}
if(trueBtn) trueBtn.onclick=toggleTrueFormDebug;
if(trueBtn2) trueBtn2.onclick=activateTimedTrueForm;
let progressResetArmed=false,progressResetTimer=null;
if(DEV) document.getElementById('progressResetBtn').onclick=()=>{
  const b=document.getElementById('progressResetBtn');
  if(!progressResetArmed){ progressResetArmed=true; b.textContent='もう一度押して初期化'; clearTimeout(progressResetTimer); progressResetTimer=setTimeout(()=>{ progressResetArmed=false; b.textContent='進行をリセット'; },3000); return; }
  clearTimeout(progressResetTimer); progressResetArmed=false; campaign=defaultCampaign(); saveCampaign();
  clearRun();
  selectedCore='initial'; debugAllThemes=false; debugTrueForm=false; forceTrueForm=false; trueFormTimer=0; trueFormCooldown=0;
  footstepEnabled=true; footstepStep=0;
  if(footstepBtn){ footstepBtn.textContent='足音：ON'; footstepBtn.classList.add('on'); }
  if(jumpTheme) refreshJumpThemes();
  seenEnemyIntros=new Set(); enemyIntroQueue=[]; enemyIntro=null; openingPoemSeen=false;
  try{ localStorage.removeItem(OPENING_SEEN_KEY); }catch(e){}
  breathHeld=false; breathTimer=0; breathCooldown=0; breathAbilityUsed=false; breathMinimapAlpha=0;
  if(breathBtn){ breathBtn.classList.remove('hot'); breathBtn.textContent='息を止める (長押し)'; breathBtn.disabled=false; breathBtn.style.opacity='1'; }
  panel.classList.remove('open'); ov.classList.remove('show','hole','ending'); showTitle();
};
const modeOverwriteDebugIds=['reBtn','noEnemiesBtn','verticalBtn','shapeBtn','goddessBtn','childRitualBtn','lordRitualBtn','endingBtn','pinReturnBtn','pinClearBtn','hakenGiftBtn','residentLineBtn','exitHoleBtn','floorJumpBtn','progressResetBtn'];
function updateCinematicDebugButtons(){
  if(!DEV) return;
  const locked=mode==='evolve'||mode==='intro'||mode==='guidance';
  for(const id of modeOverwriteDebugIds){ const b=document.getElementById(id); if(b) b.disabled=locked; }
}
document.getElementById('stage').addEventListener('pointerdown',evoSkip);

/* ---------- 見守り ---------- */
function sparkRunner(){
  if(sparkSelect||chainPause>0) return null;
  for(const m of minions){
    if(!(m.spark&&m.sparkTarget&&!m.sparkTarget.mine)) continue;
    if(m.stallTimer!==undefined&&m.stallTimer>0) continue;   // 失敗は静かに通す。ズームしない
    if(dist(m.fx,m.fy,m.sparkTarget.x,m.sparkTarget.y)<=3.0) return m;   // 成功の直前だけカメラが行く
  }
  return null;
}

/* ---------- 音 ---------- */
let AC=null;
let audioReady=false;
function audioInit(){
  if(audioReady) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    // 無音を流して暖機（最初のパチッを吸収）
    const buf=AC.createBuffer(1,AC.sampleRate*0.1|0,AC.sampleRate);
    const src=AC.createBufferSource(); src.buffer=buf; src.connect(AC.destination); src.start();
    audioReady=true;
  }catch(e){}
}
function tone(freq,dur,type,vol,delay,slideTo){
  if(!AC) return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol||0.1,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  g.gain.setValueAtTime(0,t0+dur+0.01);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.05);
}
function sfxCoin(chain){          // チャリン。連鎖が伸びるほど半音ずつ高くなる
  if(!AC) return;
  const up=Math.pow(1.0595,Math.min(12,Math.max(0,(chain||1)-1)));
  tone(1318*up,0.10,'square',0.10);
  tone(1976*up,0.20,'square',0.08,0.055);
}
function sfxIgnite(){             // ボッ。連鎖が伸びるほど太くなる
  if(!AC) return;
  const depth=Math.min(5,chainCount);
  tone(140-depth*12,0.22+depth*0.04,'sine',0.16+depth*0.02,0,70-depth*8);
  tone(520-depth*30,0.10,'triangle',0.06,0.01,240);
}
function sfxAlert(){              // 見つかった
  if(!AC) return;
  tone(760,0.09,'sawtooth',0.09);
  tone(760,0.09,'sawtooth',0.09,0.12);
}

/* ---------- 進化儀式の描画 ---------- */
function drawEvolution(){
  const e=evoAnim; if(!e) return;
  const t=e.t;
  const T1=1.6,T2=3.2,T3=5.4,T4=6.0,T5=9.2;
  ctx.save();
  ctx.fillStyle='rgba(3,2,6,'+Math.min(0.88,t*1.4)+')'; ctx.fillRect(0,0,CS,CS);
  const cx=CS/2, cy=CS/2-CS*0.05, big=CS*0.11;
  const font=(sz,c)=>{ ctx.font='500 '+sz+'px ui-monospace,Menlo,monospace';
    ctx.fillStyle=c; ctx.textAlign='center'; ctx.textBaseline='middle'; };
  if(t<T2){
    // 中断→注目：じらし
    renderMasterBody(cx,cy,big,e.from,1,{lookY:0.1,core:selectedCore,coreColor:currentCore().color});
    font(CS*0.038,'#e8e2d6');
    if(t>0.35) ctx.fillText('おや……？',cx,cy+CS*0.24);
    if(t>T1) ctx.fillText('マスターの ようすが……！',cx,cy+CS*0.30);
  }else if(t<T3){
    // 変身：旧⇄新が加速しながら交互点滅、白の光背が強まる
    const q=t-T2;
    const n=Math.floor(q*(3+q*5));
    const st=(n%2)?e.to:e.from;
    glow(cx,cy,CS*0.24,'rgba(255,255,255,%A%)',Math.min(0.7,q*0.35));
    renderMasterBody(cx,cy,big,st,1,{lookY:0.1,core:selectedCore,coreColor:currentCore().color});
    if(!e.s2){ e.s2=1; if(audioReady) tone(300,2.1,'sine',0.05,0,900); }
    font(CS*0.038,'#e8e2d6'); ctx.fillText('マスターの ようすが……！',cx,cy+CS*0.30);
  }else if(t<T4){
    // バースト
    const q=(t-T3)/(T4-T3);
    glow(cx,cy,CS*(0.1+q*0.5),'rgba(255,215,90,%A%)',0.8*(1-q*0.4));
    ctx.strokeStyle='rgba(255,230,150,'+(1-q)+')'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,cy,CS*0.5*q,0,7); ctx.stroke();
    if(!e.s3){ e.s3=1; if(audioReady){
      tone(523,0.12,'square',0.09); tone(659,0.12,'square',0.09,0.12);
      tone(784,0.12,'square',0.10,0.24); tone(1047,0.5,'square',0.12,0.36); } }
    renderMasterBody(cx,cy,big,e.to,1,{lookY:0.1,core:selectedCore,coreColor:currentCore().color});
  }else{
    // 宣言
    renderMasterBody(cx,cy,big,e.to,1,{lookY:0.1,core:selectedCore,coreColor:currentCore().color});
    font(CS*0.040,'#ffc46b');
    ctx.fillText('マスターは '+STAGE_NAMES[e.to]+'に しんかした！',cx,cy+CS*0.26);
    if(t>T4+0.8){ font(CS*0.026,'#7d7566'); ctx.fillText('タップで つづける',cx,cy+CS*0.33); }
  }
  ctx.restore();
  if(t>=T5) finishEvolutionSequence(false);
}
function evoSkip(){
  if(mode!=='evolve'||!evoAnim) return;
  if(evoAnim.t<5.4) evoAnim.t=5.4;             // 点滅中→バーストへ飛ぶ
  else if(evoAnim.t>6.4) finishEvolutionSequence(true);  // 宣言後→詩ごと終了
}
/* ---------- ループ ---------- */
reset();
let last=performance.now(), uiT=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') last=performance.now();
});
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000); last=now;
  const runner=mode==='play'?sparkRunner():null;
  if(hearts<=0 && mode==='play'){
    const pulse=0.3+0.15*Math.sin(performance.now()*0.005);
    const vg=ctx.createRadialGradient(CS/2,CS/2,CS*0.3,CS/2,CS/2,CS*0.55);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(180,30,20,'+pulse+')');
    ctx.fillStyle=vg; ctx.fillRect(0,0,CS,CS);
  }
  if(runner){
    const d=dist(runner.fx,runner.fy,runner.sparkTarget.x,runner.sparkTarget.y);
    dt*= d<2.2 ? 0.32 : 0.85;      // リーチ：着く直前だけぐっと遅く
  }
  if(mode==='play'){
    if(!runner && master.t>=1){
      const hd=heldDir();
      if(hd) stepBy(hd[0],hd[1]);
      else if(keys.size){
        if(keys.has('u')) stepBy(0,-1);
        else if(keys.has('d')) stepBy(0,1);
        else if(keys.has('l')) stepBy(-1,0);
        else if(keys.has('r')) stepBy(1,0);
      }
    }
    update(dt);
  }else if(mode==='intro') updateEnemyIntro(dt);
  else if(mode==='won') updateAscent(dt);
  else if(mode==='opening') updateOpening(dt);
  else if(mode==='evolutionBlackout') updateEvolutionBlackout(dt);
  else if(mode==='pinRespawn') updatePinRespawn(dt);
  else if(mode==='goddess') updateGoddess(dt);
  else if(mode==='poem') updateOpeningPoem(dt);
  else if(mode==='spotlight') updateFirstSpotlight(dt);
  else if(mode==='guidance') updateBreathLesson(dt);
  else if(mode==='surface') updateSurfaceEnding(dt);
  if(mode==='title'||mode==='titleExit') drawUnderbornTitle(now/1000,0,true,0);
  else if(mode==='opening') drawOpening();
  else if(mode==='evolutionBlackout'){
    ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0); ctx.fillStyle='#030207'; ctx.fillRect(0,0,CS,CS);
  }
  else if(mode==='pinRespawn') drawPinRespawn();
  else if(mode==='won') drawAscent();
  else if(mode==='goddess') drawGoddessScene();
  else if(mode==='poem') drawOpeningPoem();
  else if(mode==='spotlight') drawFirstSpotlight();
  else if(mode==='guidance') drawBreathLesson();
  else if(mode==='surface') drawSurfaceEnding();
  else if(mode==='holeChoice') drawHoleChoice();
  else if(mode==='ending'||mode==='loopSelect') drawEndingBackdrop();
  else{
    draw();
    if(mode==='evolve'&&evoAnim){ evoAnim.t+=dt; drawEvolution(); }
  }
  if(hearts<=0 && mode==='play'){
    const pulse=0.3+0.15*Math.sin(performance.now()*0.005);
    const vg=ctx.createRadialGradient(CS/2,CS/2,CS*0.3,CS/2,CS/2,CS*0.55);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(180,30,20,'+pulse+')');
    ctx.fillStyle=vg; ctx.fillRect(0,0,CS,CS);
  }
  if(runner){
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.fillRect(0,0,CS,CS*0.06); ctx.fillRect(0,CS*0.94,CS,CS*0.06);
  }
  uiT+=dt; if(uiT>0.12){ uiT=0; status(); log();
    breathBtn.classList.toggle('hot',breathHeld);
    pinBtn.classList.toggle('hot',pinHolding);
    pinBtn.style.display=campaign.hakenGiven?'':'none';
    pinBtn.textContent=pinHolding?`ハーケン ${(4-pinHold).toFixed(1)}s`:'ハーケン';
    pinBtn.disabled=!campaign.hakenGiven||mode!=='play'||breathHeld;
    if(restRoom){
      breathBtn.textContent='休憩中'; breathBtn.disabled=true; breathBtn.style.opacity='0.35';
    } else if(breathCooldown>0){
      breathBtn.textContent='回復中 '+breathCooldown.toFixed(1)+'s';
      breathBtn.disabled=true; breathBtn.style.opacity='0.35';
    } else if(breathHeld){
      breathBtn.textContent='息止め中 '+breathTimer.toFixed(1)+'s';
      breathBtn.disabled=false; breathBtn.style.opacity='1';
    } else {
      breathBtn.textContent='息を止める (長押し)';
      breathBtn.disabled=false; breathBtn.style.opacity='1';
    }
    updateTrueFormButton();
    updateCinematicDebugButtons();
  }
  requestAnimationFrame(frame);
}
resize(); showTitle(); status(); log();
requestAnimationFrame(frame);
</script>
